<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="globals.css">
<link rel="stylesheet" href="styleguide.css">
<link rel="stylesheet" href="style.css">
<title>BBQ Pit Finder - Sign In</title>
<style>
  /* Applied requested dimensions to the login page container */
  .login-page {
    width: 402px;
    height: 874px;
    position: relative;
    overflow: hidden;
    margin: 0 auto;
  }
</style>
</head>
<body>
<main class="login-page">
<img
    class="asi-mong"
    src="img/asi-mong-4yrlppy5qss-unsplash-1.png"
    alt=""
    aria-hidden="true"
  >
<div class="rectangle" aria-hidden="true"></div>
<div class="status-bar" data-colors-mode="dark" aria-label="Device status">
<div class="time" aria-label="Current time">
<div class="frame">
<p class="span-wrapper">
<span class="text-wrapper">9:41</span>
</p>
</div>
</div>
<div class="dynamic-island" aria-hidden="true"></div>
<img
        class="levels"
        src="img/levels.svg"
        alt=""
        aria-hidden="true"
      >
</div>
<article class="pit-card" aria-labelledby="page-title">
<header class="page-header">
<div class="header-tools">
<div class="brand-or-back">
<div class="flame" aria-hidden="true">
<img
                class="vector"
                src="img/vector.svg"
                alt=""
              >
</div>
<span class="eyebrow">BBQ PIT FINDER</span>
</div>
</div>
<div class="group">
<h1 class="page-title" id="page-title">Welcome Back!</h1>
<p class="div">Sign in to your Account</p>
</div>
</header>
<form class="search-field" action="#" method="post">
<label class="search-prompt" for="email">Email</label>
<input
        class="search-prompt-2"
        id="email"
        name="email"
        type="email"
        autocomplete="email"
        placeholder="example@email.com"
        required
      >
<div class="group-wrapper">
<button
            class="akar-icons-arrow-wrapper"
            type="submit"
            aria-label="Continue with email"
          >
<img
              class="akar-icons-arrow"
              src="img/akar-icons-arrow-right.svg"
              alt=""
              aria-hidden="true"
            >
</button>
</div>
</form>
<div class="group-2" role="separator" aria-label="Or continue with">
<div class="divider" aria-hidden="true"></div>
<span class="text-wrapper-2">OR</span>
<div class="divider-2" aria-hidden="true"></div>
</div>
<button class="search-field-2" type="button">
<span class="search-prompt-3">Continue with Google</span>
<img
        class="google-favicon"
        src="icons/google-favicon-2025-svg-1.png"
        alt=""
        aria-hidden="true"
      >
</button>
<button class="search-field-2" type="button">
<span class="search-prompt-4">Continue with Apple</span>
<img
        class="new-apple-logo-white"
        src="icons/new-apple-logo-white-png-large-size-1.png"
        alt=""
        aria-hidden="true"
      >
</button>
<p class="don-t-have-an">
<span class="span">Don’t have an account? </span>
<a class="text-wrapper-3" href="#">Sign up</a>
</p>
</article>
</main>
</body>
</html>
