<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="manifest" href="/manifest.json">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BBQ Pit Finder</title>
<style>
:root{
  --bg:#0d0c0b;--card-a:#2b1608;--card-b:#151210;--line:#4a2a15;--line-soft:#2c2420;
  --accent:#ff6a1a;--accent-soft:#ff9a5c;--head:#ffc9a0;--text:#f4e8de;--muted:#9a8c82;
  --radius:18px;--gap:16px;--pad:20px;
  font-family:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:dark;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:#050505;color:var(--text);line-height:1.4;display:flex;justify-content:center}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
:focus-visible{outline:2px solid var(--accent-soft);outline-offset:2px}
ul{list-style:none;padding:0}
.app{width:100%;max-width:440px;min-height:100dvh;display:flex;flex-direction:column;background:var(--bg);
  padding-top:env(safe-area-inset-top,0px)}
@media(min-width:560px){.app{margin:24px 0;min-height:0;height:min(900px,calc(100dvh - 48px));border-radius:36px;
  border:1px solid #2a2523;overflow:hidden}}
.brand-logo{display:block;align-self:flex-start;height:36px;width:auto;max-width:50%;object-fit:contain;margin-bottom:-10px}
.login-logo{display:block;align-self:center;height:140px;width:auto;max-width:70%;object-fit:contain}
main{flex:1;overflow-y:auto;padding:var(--pad);display:flex;flex-direction:column;gap:var(--gap)}
@property --ax{syntax:'<percentage>';inherits:false;initial-value:0%}
@property --ay{syntax:'<percentage>';inherits:false;initial-value:100%}
@property --bx{syntax:'<percentage>';inherits:false;initial-value:100%}
@property --by{syntax:'<percentage>';inherits:false;initial-value:20%}
@keyframes authBg{
  0%{--ax:0%;--ay:100%;--bx:100%;--by:20%}
  50%{--ax:40%;--ay:60%;--bx:60%;--by:50%}
  100%{--ax:15%;--ay:85%;--bx:85%;--by:5%}
}
main.auth{justify-content:center;background:radial-gradient(120% 70% at var(--ax,0%) var(--ay,100%),#a86f0b,transparent 55%),
  radial-gradient(90% 60% at var(--bx,100%) var(--by,20%),#4a1a08,transparent 60%),#0d0c0b;
  animation:authBg 12s ease-in-out infinite alternate}

/* type */
.eyebrow{display:flex;align-items:center;gap:6px;color:var(--accent);font-size:.75rem;font-weight:600}
h1{color:var(--head);font-size:clamp(1.7rem,7vw,2rem);line-height:1.15;font-weight:800}
h2{font-size:1.1rem;font-weight:600}
.sub{font-size:.9rem}
.muted{color:var(--muted);font-size:.75rem}
.accent{color:var(--accent)}
.rating{color:var(--accent);font-size:.78rem}
svg.i{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* cards + controls */
.card{background:linear-gradient(160deg,var(--card-a),var(--card-b));border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.field{display:flex;align-items:center;gap:10px;padding:14px;border:1px solid var(--line);border-radius:14px;background:#14100e;color:var(--muted);width:100%}
.field svg{color:var(--accent)}
.field input{flex:1;min-width:0;background:none;border:0;color:var(--text);font:inherit;outline:0}
.field:focus-within{border-color:var(--accent)}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{display:flex;justify-content:center;align-items:center;gap:8px;padding:14px;border-radius:12px;background:var(--accent);color:#fff;font-weight:700;width:100%;text-align:center}
.btn.sm{width:auto;padding:8px 14px;font-size:.85rem}
.link{color:var(--accent);font-weight:600;font-size:.82rem}
.chip{padding:8px 14px;border-radius:999px;background:#1c1816;border:1px solid var(--line-soft);font-size:.8rem}
.chips{display:flex;gap:10px;flex-wrap:wrap}
.notice{display:flex;align-items:center;gap:10px;width:100%;font-size:.82rem;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:linear-gradient(90deg,#4a2410,#2a1409)}
.notice svg{color:var(--accent)}.notice .go{margin-left:auto}
.toggle{display:flex;padding:3px;border-radius:999px;background:#201b18}
.toggle button{display:flex;gap:6px;align-items:center;padding:7px 14px;border-radius:999px;font-size:.85rem;color:var(--muted)}
.toggle [aria-pressed=true]{background:var(--accent);color:#fff;font-weight:600}
.top{display:flex;justify-content:space-between;align-items:center;color:var(--accent-soft);font-weight:600}

/* photos */
.photo{background:var(--g);border-radius:14px;min-height:96px;position:relative}
.photo-d{--g:linear-gradient(180deg,#9bb7c6 0 22%,#2f4a24 22% 55%,#7a6a4d 55%)}
.photo-a{--g:linear-gradient(180deg,#f3c58a 0 25%,#5f8a2f 25% 70%,#44361f 70%)}
.photo-c{--g:linear-gradient(180deg,#e9c796 0 28%,#5b7a30 28% 72%,#3d3320 72%)}
.photo-b1{--g:url("BBQ%20Image/BBQ_1.jpg") center/cover no-repeat,url("BBQ%20Image/BBQ_1.jpeg") center/cover no-repeat,url("BBQ%20Image/BBQ_1.png") center/cover no-repeat,url("BBQ%20Image/BBQ_1.webp") center/cover no-repeat,linear-gradient(180deg,#9bb7c6 0 22%,#2f4a24 22% 55%,#7a6a4d 55%)}
.photo-b2{--g:url("BBQ%20Image/BBQ_2.jpg") center/cover no-repeat,url("BBQ%20Image/BBQ_2.jpeg") center/cover no-repeat,url("BBQ%20Image/BBQ_2.png") center/cover no-repeat,url("BBQ%20Image/BBQ_2.webp") center/cover no-repeat,linear-gradient(180deg,#f3c58a 0 25%,#5f8a2f 25% 70%,#44361f 70%)}
.photo-b3{--g:url("BBQ%20Image/BBQ_3.jpg") center/cover no-repeat,url("BBQ%20Image/BBQ_3.jpeg") center/cover no-repeat,url("BBQ%20Image/BBQ_3.png") center/cover no-repeat,url("BBQ%20Image/BBQ_3.webp") center/cover no-repeat,linear-gradient(180deg,#e9c796 0 28%,#5b7a30 28% 72%,#3d3320 72%)}
.photo-b4{--g:url("BBQ%20Image/BBQ_4.jpg") center/cover no-repeat,url("BBQ%20Image/BBQ_4.jpeg") center/cover no-repeat,url("BBQ%20Image/BBQ_4.png") center/cover no-repeat,url("BBQ%20Image/BBQ_4.webp") center/cover no-repeat,linear-gradient(180deg,#9bb7c6 0 22%,#2f4a24 22% 55%,#7a6a4d 55%)}
.photo-b5{--g:url("BBQ%20Image/BBQ_5.jpg") center/cover no-repeat,url("BBQ%20Image/BBQ_5.jpeg") center/cover no-repeat,url("BBQ%20Image/BBQ_5.png") center/cover no-repeat,url("BBQ%20Image/BBQ_5.webp") center/cover no-repeat,linear-gradient(180deg,#f3c58a 0 25%,#5f8a2f 25% 70%,#44361f 70%)}

/* pit cards */
.pit{display:flex;flex-direction:column;gap:12px;padding:0;overflow:hidden;position:relative}
.pit-header{position:relative;width:100%}
.pit-header .photo{aspect-ratio:16/9;border-radius:var(--radius) var(--radius) 0 0;width:100%}
.pit-header .save{position:absolute;top:10px;right:10px;background:rgba(0,0,0,0.4);backdrop-filter:blur(4px);border-radius:50%;width:36px;height:36px;display:grid;place-items:center}
.pit-header .tag{position:absolute;bottom:12px;left:12px;margin-bottom:0;display:inline-flex;align-items:center;gap:6px;padding:5px 12px 5px 10px;border-radius:999px;background:linear-gradient(135deg,rgba(255,106,26,0.92),rgba(255,154,92,0.92));backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:#fff;font-size:.68rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;line-height:1;border:1px solid rgba(255,255,255,0.28);box-shadow:0 4px 12px rgba(255,106,26,0.35),0 1px 3px rgba(0,0,0,0.3)}
.pit-header .verified{position:absolute;top:10px;left:10px;display:inline-flex;align-items:center;gap:5px;padding:5px 10px 5px 8px;border-radius:999px;background:rgba(0,0,0,0.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:#7ee0a1;font-size:.68rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;line-height:1;border:1px solid rgba(126,224,161,0.45)}
.pit-header .verified svg{width:12px;height:12px;stroke-width:2.4}
.pit-header .tag::before{content:"";width:6px;height:6px;border-radius:50%;background:#fff;opacity:.9;flex:none}
.pit-body{padding:14px;display:flex;flex-direction:column;gap:14px}
.pit-title-row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.pit h3{font-size:1.15rem;line-height:1.2;color:var(--head)}
.pit .rating-badge{display:inline-flex;align-items:center;gap:4px;background:#2a170c;border:1px solid var(--line);padding:3px 8px;border-radius:8px;font-weight:700;font-size:0.8rem;white-space:nowrap}
.meta{display:flex;flex-direction:column;gap:8px;font-size:.8rem;color:#c9bcb2}
.meta-item{display:flex;align-items:center;gap:6px}
.price-tag{display:inline-block;font-size:0.95rem;font-weight:700;color:var(--accent-soft);background:rgba(255,106,26,0.1);padding:4px 10px;border-radius:8px;align-self:flex-start;border:1px solid rgba(255,106,26,0.2)}
.pit-foot{border-top:1px solid var(--line-soft);padding:12px 14px;display:flex;flex-direction:column;gap:8px;font-size:.8rem;background:rgba(0,0,0,0.15)}
.pit-foot .fac-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.pit-foot .fac-chip{background:#1c1816;border:1px solid var(--line-soft);padding:3px 8px;border-radius:6px;font-size:.72rem;color:var(--muted)}
.save{color:var(--muted)}.save[aria-pressed=true]{color:var(--accent)}.save[aria-pressed=true] svg{fill:currentColor}
.save svg{width:1.3em;height:1.3em}

/* filter sheet */
.search-row{min-width:0;max-width:100%}
.search-row .field{flex:1 1 0;width:auto;min-width:0}
.filter-btn{position:relative;flex:none;display:grid;place-items:center;width:52px;border:1px solid var(--line);border-radius:14px;background:#14100e;color:var(--accent)}
.filter-btn:hover{border-color:var(--accent)}
.fb-badge{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--accent);color:#fff;font-size:.68rem;font-weight:700;display:grid;place-items:center;line-height:1}
.fs{position:fixed;inset:0;z-index:2000;display:flex;justify-content:center;align-items:flex-end}
.fs[hidden]{display:none}
.fs-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.6)}
.fs-panel{position:relative;width:100%;max-width:440px;max-height:min(90dvh,820px);display:flex;flex-direction:column;background:linear-gradient(160deg,var(--card-a),var(--card-b));border:1px solid var(--line);border-radius:24px 24px 0 0;overflow:hidden;outline:0}
@media(min-width:560px){.fs{align-items:center}.fs-panel{border-radius:24px}}
.fs-body{flex:1;overflow-y:auto;padding:20px 20px 4px}
.fs-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding-bottom:16px;border-bottom:1px solid var(--line-soft)}
.fs-head h2{font-size:1.35rem;font-weight:700;color:var(--head)}
.fs-reset{color:var(--muted);font-size:.8rem;font-weight:600;padding:4px 0}
.fs-reset:hover{color:var(--accent)}
.fs-sec{padding:16px 0;border-bottom:1px solid var(--line-soft);display:flex;flex-direction:column;gap:12px}
.fs-sec:last-child{border-bottom:0}
.fs-sec h3{font-size:1rem;font-weight:600;color:var(--head)}
.fs-chips{display:flex;flex-wrap:wrap;gap:8px}
.fs-chip{padding:8px 14px;border-radius:999px;background:#1c1816;border:1px solid var(--line-soft);font-size:.8rem;font-weight:600;color:var(--text)}
.fs-chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.fs-check{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:.9rem;cursor:pointer}
.fs-check input{width:18px;height:18px;accent-color:var(--accent);flex:none;cursor:pointer}
.fs-grid{display:flex;flex-direction:column;gap:12px}
.fs-foot{padding:14px 20px calc(16px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line-soft);background:rgba(0,0,0,.2)}

#report-sheet textarea{width:100%;min-height:96px;padding:12px;border:1px solid var(--line);border-radius:12px;background:#14100e;color:var(--text);font:inherit;font-size:.9rem;resize:vertical;outline:0}
#report-sheet textarea:focus{border-color:var(--accent)}
#report-sheet .btn:disabled{opacity:.6;cursor:default}
#report-success{z-index:2100;align-items:center;padding:20px}
.rs-panel{position:relative;width:100%;max-width:340px;padding:28px 24px 24px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;background:linear-gradient(160deg,var(--card-a),var(--card-b));border:1px solid var(--line);border-radius:24px;box-shadow:0 20px 40px rgba(0,0,0,.5);outline:0;animation:authCardEnter .3s cubic-bezier(0.16,1,0.3,1) both}
.rs-icon{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:rgba(126,224,161,.12);border:1px solid rgba(126,224,161,.45);color:#7ee0a1}
.rs-icon svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.rs-panel h2{color:var(--head);font-size:1.3rem;font-weight:700}
.rs-panel p{color:var(--muted);font-size:.9rem}
.rs-panel .btn{margin-top:6px}

#review-sheet textarea{width:100%;min-height:96px;padding:12px;border:1px solid var(--line);border-radius:12px;background:#14100e;color:var(--text);font:inherit;font-size:.9rem;resize:vertical;outline:0}
#review-sheet textarea:focus{border-color:var(--accent)}
#review-sheet .btn:disabled{opacity:.6;cursor:default}
#review-success{z-index:2100;align-items:center;padding:20px}
.rv-stars{display:flex;gap:6px}
.rv-star{font-size:2rem;line-height:1;color:var(--line)}
.rv-star.on{color:var(--accent)}
.rv-list{display:flex;flex-direction:column;gap:10px}
.rv-item{display:flex;flex-direction:column;gap:6px}
.rv-item p{font-size:.88rem;color:#c9bcb2;word-break:break-word}

/* map */
#onemap.map{display:block;flex:1;min-height:340px;padding:0;background:#0a1230;border-radius:var(--radius);overflow:hidden}
.leaflet-container{font:inherit}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#1c1512;color:var(--text)}
.leaflet-popup-content-wrapper{border:1px solid var(--line)}
.leaflet-popup-content .link{cursor:pointer}
.pit-marker{background:none;border:0}

.results{margin-top:-8px;border:1px solid var(--line);border-radius:14px;background:#14100e;overflow-y:auto;min-height:180px;max-height:340px;z-index:100;position:relative}
.results button{display:block;width:100%;padding:14px 16px;border-top:1px solid var(--line-soft);font-size:.9rem}
.results button:first-child{border-top:0}
.results button:hover,.results button:focus-visible{background:#2a1409}
.results small{display:block;color:var(--muted);font-size:.78rem;margin-top:2px}
.results .msg{padding:14px 16px;color:var(--muted);font-size:.88rem}

/* details */
.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hero{aspect-ratio:16/10;display:flex;justify-content:space-between;align-items:flex-start;padding:12px}
.hero .save{background:var(--accent);color:#fff;border-radius:50%;width:40px;height:40px;display:grid;place-items:center}
.hero .badge{align-self:flex-end;background:rgba(0,0,0,.6);padding:4px 10px;border-radius:10px;font-size:.7rem}
.gallery .photo{aspect-ratio:3/2;min-height:0}
.carousel{position:relative}
.car-track{touch-action:pan-y;display:flex;gap:8px;overflow-x:hidden;scrollbar-width:none;border-radius:14px}
.car-track::-webkit-scrollbar{display:none}
.car-slide{flex:0 0 100%;scroll-snap-align:center;aspect-ratio:16/10}
.carousel .save{position:absolute;top:12px;left:12px;background:var(--accent);color:#fff;border-radius:50%;width:40px;height:40px;display:grid;place-items:center}
.carousel .badge{position:absolute;bottom:32px;right:12px;background:rgba(0,0,0,.6);padding:4px 10px;border-radius:10px;font-size:.7rem}
.car-dots{display:flex;justify-content:center;gap:6px;margin-top:10px}
.car-dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.car-dots i.on{background:var(--accent)}
.facts{display:flex;flex-direction:column;gap:14px}
.fact{display:grid;grid-template-columns:40px 1fr;gap:12px;font-size:.88rem}
.fact i{width:40px;height:40px;border:1px solid var(--line);border-radius:10px;display:grid;place-items:center;color:var(--accent)}
.fact small{display:block;color:var(--accent-soft);font-size:.72rem}
.fac-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:10px}
.fac-grid div{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 6px;border:1px solid var(--line);border-radius:12px;font-size:.78rem}
.fac-grid svg{color:var(--accent);width:1.5em;height:1.5em}
.warn{background:linear-gradient(160deg,#4d2a14,#2c170b)}
.warn h2{color:var(--accent-soft)}
section.stack{display:flex;flex-direction:column;gap:10px}

/* profile */
.avatar{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);color:var(--accent);font-weight:700;background:#2a170c}
.list{padding:0}
.list li{display:flex;align-items:center;gap:12px;padding:14px;border-top:1px solid var(--line-soft);font-size:.9rem}
.list li:first-child{border:0}
.list svg{color:var(--accent)}
.list small{display:block;color:var(--muted);font-size:.72rem}
.list .go{margin-left:auto;color:var(--muted)}
.switch{margin-left:auto;appearance:none;width:44px;height:26px;border-radius:999px;background:#3a3633;position:relative;cursor:pointer;transition:background .2s}
.switch::after{content:"";position:absolute;inset:3px auto 3px 3px;width:20px;border-radius:50%;background:#f3b891;transition:transform .2s}
.switch:checked{background:var(--accent)}.switch:checked::after{transform:translateX(18px)}

/* auth */
.auth-card{
  padding:24px 20px;display:flex;flex-direction:column;gap:14px;background:rgba(30,18,12,.55);backdrop-filter:blur(12px);text-align:center;
  animation: authCardEnter 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  box-shadow: 0 20px 40px rgba(0,0,0,0.4), 0 0 0 1px rgba(255,106,26,0.15);
  transition: transform 0.3s ease, box-shadow 0.3s ease;
}
.auth-card:hover{
  box-shadow: 0 24px 48px rgba(0,0,0,0.5), 0 0 20px rgba(255,106,26,0.2);
}
@keyframes authCardEnter{
  0%{opacity:0;transform:translateY(24px) scale(0.97);}
  100%{opacity:1;transform:translateY(0) scale(1);}
}

.auth-card h1{font-size:1.8rem; animation: authFadeUp 0.5s ease 0.1s both;}
.auth-card .eyebrow{align-self:flex-start; animation: authFadeUp 0.5s ease 0.05s both;}
.auth-card .sub{animation: authFadeUp 0.5s ease 0.15s both;}

@keyframes authFadeUp{
  0%{opacity:0;transform:translateY(10px);}
  100%{opacity:1;transform:translateY(0);}
}

.or{display:flex;align-items:center;gap:12px;font-size:.85rem;animation: authFadeUp 0.5s ease 0.3s both;}
.or::before,.or::after{content:"";flex:1;height:1px;background:#6b5a50}

.auth-form{display:flex;flex-direction:column;gap:14px;text-align:left;animation: authFadeUp 0.5s ease 0.2s both;}
.auth-form .field{
  align-items:center;
  transition: all 0.25s ease;
  position: relative;
  padding: 10px 14px;
}
.auth-form .field:focus-within{
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(255, 106, 26, 0.2), inset 0 1px 3px rgba(0,0,0,0.5);
  transform: translateY(-1px);
}
.auth-form input{font-size:1.05rem}
.auth-form input::placeholder{color:var(--muted)}

.eye{display:grid;place-items:center;color:var(--muted);padding:4px;transition: color 0.2s ease;}
.eye:hover,.eye[aria-pressed=true]{color:var(--text)}

.linkbtn{color:var(--accent);font-weight:600;padding:0;display:inline;transition: opacity 0.2s ease;}
.linkbtn:hover{opacity: 0.8; text-decoration: underline;}

.go-btn{
  width:34px;height:34px;border-radius:50%;background:#5a2a14;display:grid;place-items:center;color:#fff;
  transition: background 0.25s ease, transform 0.2s ease, box-shadow 0.25s ease;
  flex: none;
  position: absolute;
  right: 10px;
}
.go-btn:hover{
  background: var(--accent);
  transform: scale(1.08);
  box-shadow: 0 0 12px rgba(255,106,26,0.5);
}
.go-btn:active{transform: scale(0.95);}

.btn{
  transition: background 0.25s ease, transform 0.2s ease, box-shadow 0.25s ease;
}
.btn:hover{
  filter: brightness(1.1);
  box-shadow: 0 6px 20px rgba(255,106,26,0.35);
  transform: translateY(-1px);
}
.btn:active{transform: translateY(1px);}

.social{

const MRT_STATIONS = [
  { name: "Pasir Ris MRT", exit: "Exit B", coords: [1.372886, 103.949136] },

function calculateNearestMRT(pitLat, pitLng) {
  if (!pitLat || !pitLng) return "Confirm route";
  let nearest = MRT_STATIONS[0];
  let minDistance = Infinity;

  MRT_STATIONS.forEach(mrt => {
    const dLat = (mrt.coords[0] - pitLat) * (Math.PI / 180);
    const dLng = (mrt.coords[1] - pitLng) * (Math.PI / 180);
    const a = Math.sin(dLat / 2) ** 2 + Math.cos(pitLat * (Math.PI / 180)) * Math.cos(mrt.coords[0] * (Math.PI / 180)) * Math.sin(dLng / 2) ** 2;
    const distance = 6371 * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
    if (distance < minDistance) { minDistance = distance; nearest = mrt; }
  });

  return `${nearest.name} (${nearest.exit}) · ~${Math.round(minDistance * 1000)}m`;
}

  }
  return false;
}

async function fetchWeatherForecast() {
  try {
    const res = await fetch("https://api-open.data.gov.sg/v2/real-time/api/twenty-four-hr-forecast");
    const json = await res.json();
    if (json.code === 0 && json.data && json.data.records.length > 0) {
      const record = json.data.records[0];
      return { general: record.general.forecast.text, tempLow: record.general.temperature.low, tempHigh: record.general.temperature.high, humidityLow: record.general.relativeHumidity.low, humidityHigh: record.general.relativeHumidity.high };
    }
  } catch (err) { console.error("Weather API Error:", err); }
  return null;
}

async function fetchCarparkAvailability() {
  try {
    const res = await fetch("https://api.data.gov.sg/v1/transport/carpark-availability");
    const json = await res.json();
    if (json.items && json.items.length > 0) return json.items[0].carpark_data;
  } catch (err) { console.error("Carpark API Error:", err); }
  return [];
}

const GEO_STORE = 'bbq_geo_v1';
const GEO_CACHE = (() => { try { return JSON.parse(localStorage.getItem(GEO_STORE)) || {}; } catch (e) { return {}; } })();
const GEO_JOBS = {}, GEO_FAILED = new Set(), GEO_QUEUE = [];
let geoBusy = false;
const geoKey = p => p && p.coords ? `${p.coords[0].toFixed(5)},${p.coords[1].toFixed(5)}` : null;
const geoText = g => g ? [g.street, g.postcode].filter(Boolean).join(', ') : '';

async function fetchReverseGeocode(lat, lng) {
  const url = `https://nominatim.openstreetmap.org/reverse?format=jsonv2&addressdetails=1&zoom=18&accept-language=en&lat=${lat}&lon=${lng}`;
  const res = await fetch(url);
  if (!res.ok) throw new Error('Reverse geocode failed: ' + res.status);
  return res.json();
}

function paintGeo(key) {
  const t = geoText(GEO_CACHE[key]);
  if (t) document.querySelectorAll(`[data-geo="${key}"]`).forEach(el => { el.textContent = t; });
}

// Looks up each location once, one request at a time (keeps within the free service's rate limit), and remembers results.
function getPitGeo(p, { priority = false } = {}) {
  const key = geoKey(p);
  if (!key) return Promise.resolve(null);
  if (GEO_CACHE[key]) return Promise.resolve(GEO_CACHE[key]);
  if (GEO_FAILED.has(key)) return Promise.resolve(null);
  let job = GEO_JOBS[key];
  if (!job) {
    job = { coords: p.coords };
    job.promise = new Promise(r => { job.resolve = r; });
    GEO_JOBS[key] = job;
    GEO_QUEUE.push(key);
  }
  if (priority) { const i = GEO_QUEUE.indexOf(key); if (i > 0) { GEO_QUEUE.splice(i, 1); GEO_QUEUE.unshift(key); } }
  runGeoQueue();
  return job.promise;
}

async function runGeoQueue() {
  if (geoBusy) return;
  geoBusy = true;
  while (GEO_QUEUE.length) {
    const key = GEO_QUEUE.shift(), job = GEO_JOBS[key];
    let result = null;
    try {
      const d = await fetchReverseGeocode(job.coords[0], job.coords[1]);
      const a = d.address || {};
      result = { street: [a.house_number, a.road].filter(Boolean).join(' '), postcode: a.postcode || '' };
      GEO_CACHE[key] = result;
      try { localStorage.setItem(GEO_STORE, JSON.stringify(GEO_CACHE)); } catch (e) {}
    } catch (err) {
      console.error('Reverse geocode error:', err);
      GEO_FAILED.add(key);
    }
    delete GEO_JOBS[key];
    if (result) paintGeo(key);
    job.resolve(result);
    await new Promise(r => setTimeout(r, 1100));
  }
  geoBusy = false;
}

function geoLine(p) {
  const fallback = `${p.area}, Singapore`;
  const key = geoKey(p);
  if (!key) return `<span>${icon('pin')} ${esc(fallback)}</span>`;
  const t = geoText(GEO_CACHE[key]);
  if (!t) getPitGeo(p);
  return `<span>${icon('pin')} <span data-geo="${key}">${esc(t || fallback)}</span></span>`;
}

}

const hashStr = s => { let h = 2166136261; for (const c of String(s)) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; };
const pickBy = (arr, h, salt) => arr[((h ^ Math.imul(salt, 2654435761)) >>> 0) % arr.length];
const ACCESS_PROFILES = [
  ['Step-free paved access', 'Step-free paved path from the carpark to the pit area. Suitable for wheelchairs and prams.'],
  ['Wheelchair-accessible path', 'Wide, level path to the pit area with a gentle ramp at the entrance. Wheelchair-friendly toilets are about 50 m away.'],

  ['Level path with tactile guidance', 'Level paved path with tactile paving at key crossings. Handrails along the slope near the entrance.'],
  ['Paved path, a few gentle slopes', 'Mostly paved path with a few gentle slopes. Assistance may help for manual wheelchairs on the incline.']
];
function genPitData(id, area) {
  const h = hashStr(id + '|' + area);
  const acc = pickBy(ACCESS_PROFILES, h, 4);
  const fac = ['Toilets', 'Water'];
  if (h & 1) fac.push('Lights');
  if (h & 2) fac.push('Parking');
  return {
    rating: Number((3.8 + (h % 11) / 10).toFixed(1)),
    reviews: 18 + (h >>> 3) % 230,
    price: pickBy(['$10/pit · 2hrs', '$15/pit · 2hrs', '$20/pit · 2hrs', '$25/pit · 3hrs'], h, 1),
    agency: pickBy(['National Parks Board (NParks)', 'National Parks Board (NParks)', 'National Parks Board (NParks)', "People's Association"], h, 2),
    hours: pickBy(['7:00 AM – 10:00 PM daily', '8:00 AM – 10:30 PM daily', '9:00 AM – 10:00 PM daily'], h, 3),
    access: acc[0],
    accessLong: acc[1],
    fac
  };
}

async function loadSupabasePits() {
  try {
    if (!sb) return;
    let allData = [], page = 0, pageSize = 1000, fetchMore = true;
    while (fetchMore) {
      const { data, error } = await sb.from("pits_table").select("*").range(page * pageSize, (page + 1) * pageSize - 1);
      if (error) break;
      if (data && data.length > 0) {
        allData = allData.concat(data);
        if (data.length < pageSize) fetchMore = false; else page++;
      } else fetchMore = false;
    }

    if (allData.length > 0) {
      const newPits = {};
      const areaCounts = {};
      
      // First pass: count frequencies of base area names to detect repetitions
      allData.forEach(pit => {
        const rawArea = (pit.area || 'Pit').trim();
        areaCounts[rawArea] = (areaCounts[rawArea] || 0) + 1;
      });

      const areaSeenIndex = {};

      allData.forEach((pit, index) => {
        const pitId = pit.id ? String(pit.id).trim() : `pit_${index + 1}`;
        const rawArea = (pit.area || `Pit ${pitId}`).trim();
        const gen = genPitData(pitId, rawArea);
        let parsedFacilities = gen.fac;
        if (Array.isArray(pit.facilities)) parsedFacilities = pit.facilities;
        else if (typeof pit.facilities === 'string') {
          parsedFacilities = pit.facilities.replace(/^\{|\}$/g, '').split(',').map(f => f.trim().replace(/^"\vert{}"$/g, '')).filter(Boolean);
        }
        const lat = parseFloat(pit.latitude), lng = parseFloat(pit.longitude);
        if (hasNearbyWiFi(lat, lng) && !parsedFacilities.includes('WiFi')) parsedFacilities.push('WiFi');

        // Generate a unique/improved display name if area appears multiple times
        let displayName = rawArea;
        if (areaCounts[rawArea] > 1) {
          areaSeenIndex[rawArea] = (areaSeenIndex[rawArea] || 0) + 1;
          const suffixNum = areaSeenIndex[rawArea];
          displayName = `${rawArea} Pit ${suffixNum}`;
        }

        newPits[pitId] = {
          id: pitId,
          area: rawArea,
          displayName: displayName,
          rating: pit.rating || gen.rating,
          reviews: pit.reviews || gen.reviews,
          access: gen.access,
          accessLong: gen.accessLong,
          fac: parsedFacilities,
          photo: index < 5 ? 'b' + (index + 1) : (['a','c','d'].includes(pit.photo_key) ? pit.photo_key : ['d','a','c'][index % 3]),
          price: pit.price || gen.price,
          verified: ((hashStr(pitId + '|verified') >>> 7) & 1) === 1,
          extra: genExtra(pitId),
          agency: gen.agency,
          hours: gen.hours,
          coords: [!isNaN(lat) ? lat : 1.3000, !isNaN(lng) ? lng : 103.9110],
          nearestMRT: calculateNearestMRT(!isNaN(lat) ? lat : 1.3000, !isNaN(lng) ? lng : 103.9110)
        };
      });
      PITS = newPits;
      const allIds = Object.keys(PITS);
      if (allIds.length > 0 && (!state.viewing || !PITS[state.viewing])) {
        state.viewing = allIds[0];
        state.baseline = allIds[0];
      }
      const currentRoute = document.getElementById('view')?.dataset?.route;
      if (currentRoute === 'explore' || currentRoute === 'map') go(currentRoute, { push: false });
    }
  } catch (err) { console.error("Supabase Pits Exception:", err); }
}

let map = null;
function destroyMap() { if (map) { map.remove(); map = null; } }

function initMap() {
  const el = document.getElementById('onemap');
  if (!el || typeof L === 'undefined') return;
  
  if (!map) {
    map = L.map(el, { zoomControl: false }).setView([1.3521, 103.8198], 11);
    L.control.zoom({ position: 'bottomright' }).addTo(map);
    L.tileLayer('https://www.onemap.gov.sg/maps/tiles/Default/{z}/{x}/{y}.png', { detectRetina: true, minZoom: 9, maxZoom: 19, attribution: '<a href="https://www.onemap.gov.sg/" target="_blank" rel="noopener">OneMap</a>' }).addTo(map);
  }

  map.eachLayer(layer => {
    if (layer instanceof L.CircleMarker) {
      map.removeLayer(layer);
    }
  });

  const bounds = [];
  const q = state.searchQuery.toLowerCase().trim();
  Object.values(PITS).forEach(p => {
    if (q && !p.displayName.toLowerCase().includes(q) && !p.area.toLowerCase().includes(q) && !p.fac.some(f => f.toLowerCase().includes(q))) return;
    if (!matchesFilters(p)) return;
    if (!p.coords) return;
    bounds.push(p.coords);
    L.circleMarker(p.coords, { radius: 7, fillColor: '#ff6a1a', color: '#ffffff', weight: 1.5, opacity: 1, fillOpacity: 0.9 })
      .addTo(map)
      .on('click', () => map.setView(p.coords, 17))
      .bindPopup(`<strong>${p.displayName}</strong><br>${p.access}<br><button class="link" data-pit="${p.id}">View pit →</button>`);
  });
  if (bounds.length > 0) map.fitBounds(bounds, { padding: [40, 40], maxZoom: 15 });
  setTimeout(() => map && map.invalidateSize(), 150);
}

document.addEventListener('submit', async e => {
  if (e.target.id !== 'login-form') return;
  e.preventDefault();
  const email = document.getElementById('login-email').value.trim();
  if (!/^\S+@\S+\.\S+$/.test(email)) return authMsg('Enter a valid email address.', true);
  authUi.email = email;
  if (authUi.step === 'email') { authUi.step = 'password'; return rerenderLogin(); }
  const password = document.getElementById('login-password').value;
  if (!password) return authMsg('Enter your password.', true);

  const submitBtn = e.target.querySelector('button[type=submit]');
  if (submitBtn) submitBtn.disabled = true;
  try {
    if (authUi.mode === 'signup') {
      const opts = location.protocol.startsWith('http') ? { emailRedirectTo: location.origin + location.pathname } : {};
      const { data, error } = await sb.auth.signUp({ email, password, options: opts });
      if (error) {
        authMsg(error.message, true);
      } else if (data.session) {
        // Email confirmation is OFF: user is already signed in, onAuthStateChange takes them to Explore.
      } else if (data.user && data.user.identities && data.user.identities.length === 0) {
        authUi.mode = 'login'; rerenderLogin();
        authMsg('This email is already registered. Please log in.', true);
      } else {
        // Email confirmation is ON: account exists but must be confirmed before login.
        authUi.mode = 'login'; rerenderLogin();
        authMsg('Account created! Check your inbox (and spam) and click the confirmation link, then log in.');
      }
    } else {
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if (error) {
        if (error.code === 'email_not_confirmed' || /not confirmed/i.test(error.message)) authMsg('Please confirm your email first. Check your inbox (and spam) for the link.', true);
        else if (error.code === 'invalid_credentials' || error.status === 400) authMsg('Incorrect email or password.', true);
        else authMsg(error.message, true);
      }
    }
  } finally {
    const b = document.querySelector('#login-form button[type=submit]');
    if (b) b.disabled = false;
  }
});

const view = $('#view'), nav = $('#nav');
const history = [];

function go(route, { push = true } = {}) {
  if (!screens[route] || (!session && route !== 'login')) route = 'login';
  if (push) history.push(route);
  if (route !== 'explore' && route !== 'map') destroyMap();
  view.innerHTML = screens[route]();
  view.className = route === 'login' ? 'auth' : '';
  view.scrollTop = 0;
  nav.hidden = route === 'login';
  nav.querySelectorAll('[data-tab]').forEach(b => {
    if (b.dataset.tab === TAB[route]) b.setAttribute('aria-current', 'page');
    else b.removeAttribute('aria-current');
  });
  view.dataset.route = route;
  view.focus({ preventScroll: true });
  if (route === 'map' || (route === 'explore' && state.listMode === 'map')) requestAnimationFrame(initMap);
  if (route === 'pit') { loadPitWeather(); loadPitCarparks(); loadPitGeo(); loadPitReviews(); }

      if (state.listMode === 'map') setTimeout(initMap, 50);
    } else {
      go('explore', { push: false });
    }
    return;
  }

  const t = e.target.closest('[data-go],[data-save],[data-pit],[data-compare],[data-back]');
  if (!t) return;
  
  if (t.dataset.save) {
    state.saved.has(t.dataset.save) ? state.saved.delete(t.dataset.save) : state.saved.add(t.dataset.save);
    if (view.dataset.route === 'saved') { const top = view.scrollTop; go(view.dataset.route, { push: false }); view.scrollTop = top; }

    state.viewing = t.dataset.pit;
    state.recent = [t.dataset.pit, ...state.recent.filter(id => id !== t.dataset.pit)].slice(0, 5);
    go('pit');
  } else if (t.dataset.compare) {
    state.comparing = [state.baseline, t.dataset.compare]; go('compare');

    const targetRoute = t.dataset.go;
    const currentRoute = view.dataset.route;
    if (targetRoute === 'explore' && (currentRoute === 'explore' || currentRoute === 'map')) {
      return; // Ignore redundant double-taps on Explore

    go(t.dataset.go);
  }
});

// Touch swipe for the photo carousel: the photo follows the finger, then settles on the nearest photo.
(() => {
  let tr = null, startX = 0, startY = 0, startLeft = 0, dir = '';
  const step = t => t.children[0].offsetWidth + 8;
  document.addEventListener('touchstart', e => {
    const t = e.target.closest && e.target.closest('#car-track');
    if (!t || e.touches.length !== 1) return;
    tr = t; startX = e.touches[0].clientX; startY = e.touches[0].clientY; startLeft = t.scrollLeft; dir = '';
  }, { passive: true });
  document.addEventListener('touchmove', e => {
    if (!tr) return;
    const dx = e.touches[0].clientX - startX, dy = e.touches[0].clientY - startY;
    if (!dir && (Math.abs(dx) > 6 || Math.abs(dy) > 6)) dir = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
    if (dir === 'x') tr.scrollLeft = startLeft - dx;
  }, { passive: true });
  const end = e => {
    if (!tr) return;
    const t = tr; tr = null;
    if (dir !== 'x') return;
    const x = (e.changedTouches && e.changedTouches[0] ? e.changedTouches[0].clientX : startX), dx = x - startX;
    let i = Math.round(startLeft / step(t));
    if (Math.abs(dx) > step(t) * 0.15) i += dx < 0 ? 1 : -1;
    i = Math.min(t.children.length - 1, Math.max(0, i));
    t.scrollTo({ left: i * step(t), behavior: 'smooth' });
  };
  document.addEventListener('touchend', end);
  document.addEventListener('touchcancel', end);
})();

/* ---------- Filters ---------- */
const FS_DISTANCES = [[1, '1 km'], [3, '3 km'], [5, '5 km'], [10, '10 km'], [0, 'Any']];
const FS_AVAIL = [['today', 'Available Today'], ['weekend', 'Available This Weekend'], ['walkin', 'Walk-in Allowed']];
const FS_FAC = [['shelter', 'Sheltered Pit'], ['tables', 'Tables & Benches'], ['toilets', 'Nearby Toilets'], ['water', 'Water Point'], ['lights', 'Lighting'], ['parking', 'Parking']];
const FS_PRICE = [['free', 'Free'], ['lt20', 'Below $20'], ['20-50', '$20–$50'], ['50-100', '$50–$100']];
const FS_GROUP = [['1-5', '1–5'], ['6-10', '6–10'], ['11-20', '11–20'], ['20+', '20+']];
const FS_GROUP_NEED = { '1-5': 5, '6-10': 10, '11-20': 20, '20+': 21 };
const FS_FAC_KEY = { toilets: 'toilet', water: 'water', lights: 'light', parking: 'park' };

const fsDefault = () => ({ distance: 0, avail: [], fac: [], price: '', group: '' });
const fsClone = f => ({ ...f, avail: [...f.avail], fac: [...f.fac] });
const fsCount = f => (f.distance ? 1 : 0) + f.avail.length + f.fac.length + (f.price ? 1 : 0) + (f.group ? 1 : 0);
let fsDraft = fsDefault();

// The database has no availability / sheltered / tables / group-capacity fields, so these are generated per pit (stable, like the other generated pit data).
function genExtra(id) {
  const h = hashStr(id + '|filters');
  return { today: h % 10 < 6, weekend: (h >>> 4) % 10 < 7, walkin: (h >>> 8) % 10 < 4, shelter: (h >>> 12) % 10 < 5, tables: (h >>> 16) % 10 < 6, capacity: [6, 10, 15, 20, 30, 40][(h >>> 20) % 6] };
}
const facHas = (p, k) => k === 'shelter' ? !!(p.extra && p.extra.shelter) : k === 'tables' ? !!(p.extra && p.extra.tables) : p.fac.some(f => f.toLowerCase().includes(FS_FAC_KEY[k]));
function priceVal(p) {
  const s = String(p.price || PRICE);
  if (/free/i.test(s)) return 0;
  const m = s.match(/\d+(\.\d+)?/);
  return m ? parseFloat(m[0]) : null;
}
function distKm(a, b) {
  const r = Math.PI / 180, dLat = (b[0] - a[0]) * r, dLng = (b[1] - a[1]) * r;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(a[0] * r) * Math.cos(b[0] * r) * Math.sin(dLng / 2) ** 2;
  return 6371 * 2 * Math.atan2(Math.sqrt(h), Math.sqrt(1 - h));
}
function matchesFilters(p, f = state.filters) {
  const x = p.extra || {};
  if (f.distance && state.userLoc && p.coords && distKm(state.userLoc, p.coords) > f.distance) return false;
  if (f.avail.some(k => !x[k])) return false;
  if (f.fac.some(k => !facHas(p, k))) return false;
  if (f.price) {
    const v = priceVal(p);
    if (v === null) return false;
    const ok = f.price === 'free' ? v === 0 : f.price === 'lt20' ? v > 0 && v < 20 : f.price === '20-50' ? v >= 20 && v <= 50 : v > 50 && v <= 100;
    if (!ok) return false;
  }
  if (f.group && (x.capacity || 0) < FS_GROUP_NEED[f.group]) return false;
  return true;
}
const textMatches = (p, q) => !q || p.displayName.toLowerCase().includes(q) || p.area.toLowerCase().includes(q) || p.fac.some(f => f.toLowerCase().includes(q));
function exploreIds() {
  const q = state.searchQuery.toLowerCase().trim();
  const all = Object.keys(PITS);
  if (!q && !fsCount(state.filters)) return all.slice(0, 5);
  return all.filter(id => matchesFilters(PITS[id]) && textMatches(PITS[id], q));
}
const exploreEmpty = () => fsCount(state.filters)
  ? `<p class="card sub">No BBQ pits match your filters${state.searchQuery.trim() ? ' and search' : ''}.</p>`
  : `<p class="card sub">No BBQ pits or facilities found matching "${esc(state.searchQuery)}"</p>`;
const countMatches = f => { const q = state.searchQuery.toLowerCase().trim(); return Object.values(PITS).filter(p => matchesFilters(p, f) && textMatches(p, q)).length; };

function updateFilterBadge() {
  const n = fsCount(state.filters);
  document.querySelectorAll('.filter-btn').forEach(b => {
    let el = b.querySelector('.fb-badge');
    if (n) { if (!el) { el = document.createElement('span'); el.className = 'fb-badge'; b.appendChild(el); } el.textContent = n; }
    else if (el) el.remove();
  });
}

function refreshExplore() {
  const route = document.getElementById('view')?.dataset?.route;
  const lc = document.getElementById('pit-list-container');
  if (lc) {
    const ids = exploreIds();
    lc.innerHTML = ids.length > 0 ? ids.map(id => pitCard(id)).join('') : exploreEmpty();
  }
  if (route === 'map' || (route === 'explore' && state.listMode === 'map')) initMap();
  updateFilterBadge();
  if (state.searchQuery) {
    const q = state.searchQuery.toLowerCase().trim();
    const matches = Object.values(PITS).filter(p => matchesFilters(p) && textMatches(p, q));
    renderPitResults(matches, matches.length ? '' : 'No matching BBQ pits or facilities found.');
  }
}

function requestUserLoc() {
  if (state.userLoc || state.locPending) return;
  if (!navigator.geolocation) { state.locMsg = 'Location isn’t available on this device, so distance isn’t applied.'; syncSheet(); return; }
  state.locPending = true; state.locMsg = 'Getting your location…'; syncSheet();
  navigator.geolocation.getCurrentPosition(pos => {
    state.userLoc = [pos.coords.latitude, pos.coords.longitude];
    state.locPending = false; state.locMsg = '';
    syncSheet();
    if (state.filters.distance) refreshExplore();
  }, () => {
    state.locPending = false; state.locMsg = 'Couldn’t get your location, so distance isn’t applied.';
    syncSheet();
  }, { timeout: 8000, maximumAge: 300000 });
}

function syncSheet() {
  const sh = document.getElementById('filter-sheet');
  if (!sh) return;
  sh.querySelectorAll('[data-fs-set]').forEach(b => {
    const k = b.dataset.fsSet, cur = k === 'distance' ? String(fsDraft.distance) : fsDraft[k];
    b.setAttribute('aria-pressed', String(cur === b.dataset.val));
  });
  sh.querySelectorAll('[data-fs-check]').forEach(i => { i.checked = fsDraft[i.dataset.fsCheck].includes(i.value); });
  const n = countMatches(fsDraft);
  document.getElementById('fs-apply').textContent = `Show ${n} Location${n === 1 ? '' : 's'}`;
  const msg = document.getElementById('fs-loc-msg');
  msg.textContent = fsDraft.distance ? state.locMsg : '';
  msg.hidden = !msg.textContent;
}
function openSheet() {
  fsDraft = fsClone(state.filters);
  if (fsDraft.distance) requestUserLoc();
  syncSheet();
  const sh = document.getElementById('filter-sheet');
  sh.hidden = false;
  sh.querySelector('.fs-body').scrollTop = 0;
  sh.querySelector('.fs-panel').focus({ preventScroll: true });
}
const closeSheet = () => { document.getElementById('filter-sheet').hidden = true; };

document.addEventListener('click', e => {
  const t = e.target.closest('[data-fs-open],[data-fs-close],[data-fs-reset],[data-fs-apply],[data-fs-set]');
  if (!t) return;
  if ('fsOpen' in t.dataset) openSheet();
  else if ('fsClose' in t.dataset) closeSheet();
  else if ('fsReset' in t.dataset) { fsDraft = fsDefault(); syncSheet(); }
  else if ('fsApply' in t.dataset) { state.filters = fsClone(fsDraft); closeSheet(); refreshExplore(); }
  else {
    const k = t.dataset.fsSet, v = t.dataset.val;
    if (k === 'distance') { fsDraft.distance = Number(v); if (fsDraft.distance) requestUserLoc(); }
    else fsDraft[k] = fsDraft[k] === v ? '' : v;
    syncSheet();
  }
});
document.addEventListener('change', e => {
  const c = e.target.closest && e.target.closest('[data-fs-check]');
  if (!c) return;
  const list = fsDraft[c.dataset.fsCheck];
  const i = list.indexOf(c.value);
  if (c.checked && i < 0) list.push(c.value);
  else if (!c.checked && i >= 0) list.splice(i, 1);
  syncSheet();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !document.getElementById('filter-sheet').hidden) closeSheet();
});

/* ---------- Report a pit ---------- */
const RP_REASONS = ['Incorrect information', 'Closed or unavailable', 'Damaged or unsafe', 'Dirty or poorly maintained', 'Other'];
let rpPit = null, rpReason = '', rpBusy = false, rpDone = false;

document.body.insertAdjacentHTML('beforeend', `
<div class="fs" id="report-sheet" hidden>
  <div class="fs-backdrop" data-rp-close></div>
  <div class="fs-panel" role="dialog" aria-modal="true" aria-labelledby="rp-title" tabindex="-1">
    <div class="fs-body">
      <div class="fs-head"><div><h2 id="rp-title">Report this pit</h2><p class="muted" id="rp-pit"></p></div><button type="button" class="fs-reset" data-rp-close>Cancel</button></div>
      <section class="fs-sec"><h3>What’s the problem?</h3><div class="fs-chips">${RP_REASONS.map(r => `<button type="button" class="fs-chip" data-rp-set="${r}" aria-pressed="false">${r}</button>`).join('')}</div></section>
      <section class="fs-sec"><h3>Details</h3><textarea id="rp-details" maxlength="500" placeholder="Tell us what’s wrong (optional)" aria-label="Report details"></textarea><p class="sub" id="rp-msg" role="status" aria-live="polite" hidden></p></section>
    </div>
    <div class="fs-foot"><button type="button" class="btn" id="rp-submit" data-rp-submit>Submit report</button></div>
  </div>
</div>`);

function setRpMsg(text, isError = false) {
  const el = document.getElementById('rp-msg');
  el.textContent = text;
  el.hidden = !text;
  el.style.color = isError ? '#ff8a6a' : 'var(--accent-soft)';
}
function syncReport() {
  document.querySelectorAll('[data-rp-set]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.rpSet === rpReason)));
  const btn = document.getElementById('rp-submit');
  btn.textContent = rpDone ? 'Done' : rpBusy ? 'Sending…' : 'Submit report';
  btn.disabled = rpBusy;
}
function openReport(id) {
  const p = PITS[id];
  if (!p) return;
  rpPit = id; rpReason = ''; rpBusy = false; rpDone = false;
  document.getElementById('rp-pit').textContent = p.displayName;
  document.getElementById('rp-details').value = '';
  setRpMsg('');
  syncReport();
  const sh = document.getElementById('report-sheet');
  sh.hidden = false;
  sh.querySelector('.fs-body').scrollTop = 0;
  sh.querySelector('.fs-panel').focus({ preventScroll: true });
}
const closeReport = () => { document.getElementById('report-sheet').hidden = true; };

async function submitReport() {
  if (rpDone) return closeReport();
  if (rpBusy) return;
  const details = document.getElementById('rp-details').value.trim();
  if (!rpReason) return setRpMsg('Please choose what the problem is.', true);
  if (rpReason === 'Other' && !details) return setRpMsg('Please add a few details.', true);
  const p = PITS[rpPit];
  if (!p) return;
  rpBusy = true; setRpMsg(''); syncReport();
  try {
    if (!sb) throw new Error('Not connected');
    const { error } = await sb.from('pit_reports').insert({ pit_id: String(p.id), pit_name: p.displayName, reason: rpReason, details: details || null, user_id: session?.user?.id || null });
    if (error) throw error;
    rpDone = true;
    setRpMsg('Thanks, your report has been submitted.');
    closeReport();
    showReportSuccess();
  } catch (err) {
    console.error('Report error:', err);
    setRpMsg('Couldn’t send your report. Please try again.', true);
  }
  rpBusy = false;
  syncReport();
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-report],[data-rp-close],[data-rp-set],[data-rp-submit]');
  if (!t) return;
  if (t.dataset.report) openReport(t.dataset.report);
  else if ('rpClose' in t.dataset) closeReport();
  else if ('rpSubmit' in t.dataset) submitReport();
  else if (!rpBusy && !rpDone) { rpReason = rpReason === t.dataset.rpSet ? '' : t.dataset.rpSet; syncReport(); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !document.getElementById('report-sheet').hidden) closeReport();
});

document.body.insertAdjacentHTML('beforeend', `
<div class="fs" id="report-success" hidden>
  <div class="fs-backdrop" data-rs-close></div>
  <div class="rs-panel" role="alertdialog" aria-modal="true" aria-labelledby="rs-title" aria-describedby="rs-text" tabindex="-1">
    <span class="rs-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></span>
    <h2 id="rs-title">Report submitted</h2>
    <p id="rs-text">Your report has been successfully submitted. Thank you for helping us keep the pit information accurate.</p>
    <button type="button" class="btn" data-rs-close>OK</button>
  </div>
</div>`);
function showReportSuccess() {
  const el = document.getElementById('report-success');
  el.hidden = false;
  el.querySelector('.rs-panel').focus({ preventScroll: true });
}
const closeReportSuccess = () => { document.getElementById('report-success').hidden = true; };
document.addEventListener('click', e => { if (e.target.closest('[data-rs-close]')) closeReportSuccess(); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !document.getElementById('report-success').hidden) closeReportSuccess();
});

/* ---------- Reviews ---------- */
function renderReviews(list) {
  if (!list.length) return `<p class="sub">No reviews yet. Be the first to review this pit.</p>`;
  const avg = (list.reduce((a, r) => a + Number(r.rating || 0), 0) / list.length).toFixed(1);
  const stars = n => '★'.repeat(n) + '☆'.repeat(5 - n);
  return `<p class="sub"><span class="rating" style="font-size:1.1rem">★ ${avg}</span> <span class="muted">(${list.length} review${list.length === 1 ? '' : 's'})</span></p>` + list.map(r => {
    const n = Math.min(5, Math.max(0, Math.round(Number(r.rating) || 0)));
    const d = r.created_at ? new Date(r.created_at).toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' }) : '';
    return `<article class="card rv-item"><div class="row between"><strong style="color:var(--head)">${esc(r.user_name || 'Guest')}</strong><span class="muted">${esc(d)}</span></div><span class="rating">${stars(n)}</span>${r.comment ? `<p>${esc(r.comment)}</p>` : ''}</article>`;
  }).join('');
}
async function loadPitReviews() {
  const id = state.viewing;
  const box = document.getElementById('reviews-list');
  if (!box) return;
  try {
    if (!sb) throw new Error('Not connected');
    const { data, error } = await sb.from('pit_reviews').select('*').eq('pit_id', String(id)).order('created_at', { ascending: false }).limit(50);
    if (error) throw error;
    const el = document.getElementById('reviews-list');
    if (el && state.viewing === id) el.innerHTML = renderReviews(data || []);
  } catch (err) {
    console.error('Reviews error:', err);
    const el = document.getElementById('reviews-list');
    if (el) el.innerHTML = `<p class="sub">Reviews are currently unavailable.</p>`;
  }
}

let rvPit = null, rvRating = 0, rvBusy = false;
document.body.insertAdjacentHTML('beforeend', `
<div class="fs" id="review-sheet" hidden>
  <div class="fs-backdrop" data-rv-close></div>
  <div class="fs-panel" role="dialog" aria-modal="true" aria-labelledby="rv-title" tabindex="-1">
    <div class="fs-body">
      <div class="fs-head"><div><h2 id="rv-title">Write a review</h2><p class="muted" id="rv-pit"></p></div><button type="button" class="fs-reset" data-rv-close>Cancel</button></div>
      <section class="fs-sec"><h3>Your rating</h3><div class="rv-stars" role="group" aria-label="Star rating">${[1, 2, 3, 4, 5].map(n => `<button type="button" class="rv-star" data-rv-star="${n}" aria-label="${n} star${n === 1 ? '' : 's'}" aria-pressed="false">★</button>`).join('')}</div></section>
      <section class="fs-sec"><h3>Your review</h3><textarea id="rv-comment" maxlength="500" placeholder="Share your experience (optional)" aria-label="Your review"></textarea><p class="sub" id="rv-msg" role="status" aria-live="polite" hidden></p></section>
    </div>
    <div class="fs-foot"><button type="button" class="btn" id="rv-submit" data-rv-submit>Submit review</button></div>
  </div>
</div>
<div class="fs" id="review-success" hidden>
  <div class="fs-backdrop" data-rvs-close></div>
  <div class="rs-panel" role="alertdialog" aria-modal="true" aria-labelledby="rvs-title" aria-describedby="rvs-text" tabindex="-1">
    <span class="rs-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></span>
    <h2 id="rvs-title">Review submitted</h2>
    <p id="rvs-text">Your review has been successfully submitted. Thank you for sharing your experience.</p>
    <button type="button" class="btn" data-rvs-close>OK</button>
  </div>
</div>`);

function setRvMsg(text, isError = false) {
  const el = document.getElementById('rv-msg');
  el.textContent = text;
  el.hidden = !text;
  el.style.color = isError ? '#ff8a6a' : 'var(--accent-soft)';
}
function syncReview() {
  document.querySelectorAll('[data-rv-star]').forEach(b => {
    const on = Number(b.dataset.rvStar) <= rvRating;
    b.classList.toggle('on', on);
    b.setAttribute('aria-pressed', String(Number(b.dataset.rvStar) === rvRating));
  });
  const btn = document.getElementById('rv-submit');
  btn.textContent = rvBusy ? 'Sending…' : 'Submit review';
  btn.disabled = rvBusy;
}
function openReview(id) {
  const p = PITS[id];
  if (!p) return;
  rvPit = id; rvRating = 0; rvBusy = false;
  document.getElementById('rv-pit').textContent = p.displayName;
  document.getElementById('rv-comment').value = '';
  setRvMsg('');
  syncReview();
  const sh = document.getElementById('review-sheet');
  sh.hidden = false;
  sh.querySelector('.fs-body').scrollTop = 0;
  sh.querySelector('.fs-panel').focus({ preventScroll: true });
}
const closeReview = () => { document.getElementById('review-sheet').hidden = true; };
function showReviewSuccess() {
  const el = document.getElementById('review-success');
  el.hidden = false;
  el.querySelector('.rs-panel').focus({ preventScroll: true });
}
const closeReviewSuccess = () => { document.getElementById('review-success').hidden = true; };

async function submitReview() {
  if (rvBusy) return;
  if (!rvRating) return setRvMsg('Please select a star rating.', true);
  const p = PITS[rvPit];
  if (!p) return;
  const comment = document.getElementById('rv-comment').value.trim();
  rvBusy = true; setRvMsg(''); syncReview();
  let ok = false;
  try {
    if (!sb || !session?.user?.id) throw new Error('Please sign in');
    const { error } = await sb.from('pit_reviews').insert({ pit_id: String(p.id), pit_name: p.displayName, rating: rvRating, comment: comment || null, user_id: session.user.id, user_name: displayName() });
    if (error) {
      if (error.code === '23505') setRvMsg('You’ve already reviewed this pit.', true);
      else throw error;
    } else ok = true;
  } catch (err) {
    console.error('Review error:', err);
    setRvMsg('Couldn’t submit your review. Please try again.', true);
  }
  rvBusy = false;
  syncReview();
  if (ok) { closeReview(); showReviewSuccess(); loadPitReviews(); }
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-review-open],[data-rv-close],[data-rv-star],[data-rv-submit],[data-rvs-close]');
  if (!t) return;
  if (t.dataset.reviewOpen) openReview(t.dataset.reviewOpen);
  else if ('rvClose' in t.dataset) closeReview();
  else if ('rvSubmit' in t.dataset) submitReview();
  else if ('rvsClose' in t.dataset) closeReviewSuccess();
  else if (!rvBusy) { rvRating = rvRating === Number(t.dataset.rvStar) ? 0 : Number(t.dataset.rvStar); syncReview(); }
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (!document.getElementById('review-success').hidden) closeReviewSuccess();
  else if (!document.getElementById('review-sheet').hidden) closeReview();
});

if (!sb) {
  go('login');
  authMsg('Sign-in could not load.', true);
} else {
  loadSupabasePits();
  sb
    .channel('public:pits')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'pits_table' }, payload => {
      console.log('Realtime DB change received:', payload);
      loadSupabasePits();
    })
    .subscribe();

  sb.auth.onAuthStateChange((event, s) => {
    session = s;
    const route = view.dataset.route;
    if (event === 'INITIAL_SESSION') go(s ? 'explore' : 'login', { push: false });
    else if (event === 'SIGNED_IN' && route === 'login') go('explore');
    else if (event === 'SIGNED_OUT') { history.length = 0; Object.assign(authUi, { step: 'email', mode: 'login', email: '' }); go('login'); }
  });
}
</script>
<script>
/* loading screen controller (added) */
(function () {
  var loader = document.getElementById('app-loader');
  if (!loader) return;
  var start = Date.now(), routeSeenAt = 0, done = false;
  function finish() {
    if (done) return;
    done = true;
    clearInterval(timer);
    loader.classList.add('ls-hide');
    setTimeout(function () { loader.remove(); }, 500);
  }
  var timer = setInterval(function () {
    var now = Date.now();
    if (now - start > 8000) return finish();          // hard fallback
    var v = document.getElementById('view');
    var route = v && v.dataset ? v.dataset.route : '';
    if (!route) return;                                // auth state not resolved yet
    if (!routeSeenAt) routeSeenAt = now;
    var pitsReady = false;
    try { pitsReady = Object.keys(PITS).length > 0; } catch (e) {}
    var ready = route === 'login' || pitsReady || now - routeSeenAt > 3000;
    if (ready && now - start > 700) finish();          // brief minimum so it never flashes
  }, 100);
})();
</script>
</body>
