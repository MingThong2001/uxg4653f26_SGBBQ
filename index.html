<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BBQ Pit Finder</title>
<style>
:root{
  --bg:#0d0c0b;--card-a:#2b1608;--card-b:#151210;--line:#4a2a15;--line-soft:#2c2420;
  --accent:#ff6a1a;--accent-soft:#ff9a5c;--head:#ffc9a0;--text:#f4e8de;--muted:#9a8c82;
  --radius:18px;--gap:16px;--pad:20px;
  font-family:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:dark;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:#050505;color:var(--text);line-height:1.4;display:flex;justify-content:center}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
:focus-visible{outline:2px solid var(--accent-soft);outline-offset:2px}
ul{list-style:none;padding:0}
.app{width:100%;max-width:440px;min-height:100dvh;display:flex;flex-direction:column;background:var(--bg);
  padding-top:env(safe-area-inset-top,0px)}
@media(min-width:560px){.app{margin:24px 0;min-height:0;height:min(900px,calc(100dvh - 48px));border-radius:36px;
  border:1px solid #2a2523;overflow:hidden}}
main{flex:1;overflow-y:auto;padding:var(--pad);display:flex;flex-direction:column;gap:var(--gap)}
main.auth{justify-content:center;background:radial-gradient(120% 70% at 0% 100%,#a86f0b,transparent 55%),
  radial-gradient(90% 60% at 100% 20%,#4a1a08,transparent 60%),#0d0c0b}

/* type */
.eyebrow{display:flex;align-items:center;gap:6px;color:var(--accent);font-size:.75rem;font-weight:600}
h1{color:var(--head);font-size:clamp(1.7rem,7vw,2rem);line-height:1.15;font-weight:800}
h2{font-size:1.1rem;font-weight:600}
.sub{font-size:.9rem}
.muted{color:var(--muted);font-size:.75rem}
.accent{color:var(--accent)}
.rating{color:var(--accent);font-size:.78rem}
svg.i{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* cards + controls */
.card{background:linear-gradient(160deg,var(--card-a),var(--card-b));border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.field{display:flex;align-items:center;gap:10px;padding:14px;border:1px solid var(--line);border-radius:14px;background:#14100e;color:var(--muted);width:100%}
.field svg{color:var(--accent)}
.field input{flex:1;min-width:0;background:none;border:0;color:var(--text);font:inherit;outline:0}
.field:focus-within{border-color:var(--accent)}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{display:flex;justify-content:center;align-items:center;gap:8px;padding:14px;border-radius:12px;background:var(--accent);color:#fff;font-weight:700;width:100%}
.btn.sm{width:auto;padding:8px 14px;font-size:.85rem}
.link{color:var(--accent);font-weight:600;font-size:.82rem}
.chip{padding:8px 14px;border-radius:999px;background:#1c1816;border:1px solid var(--line-soft);font-size:.8rem}
.chips{display:flex;gap:10px;flex-wrap:wrap}
.notice{display:flex;align-items:center;gap:10px;width:100%;font-size:.82rem;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:linear-gradient(90deg,#4a2410,#2a1409)}
.notice svg{color:var(--accent)}.notice .go{margin-left:auto}
.toggle{display:flex;padding:3px;border-radius:999px;background:#201b18}
.toggle button{display:flex;gap:6px;align-items:center;padding:7px 14px;border-radius:999px;font-size:.85rem;color:var(--muted)}
.toggle [aria-pressed=true]{background:var(--accent);color:#fff;font-weight:600}
.top{display:flex;justify-content:space-between;align-items:center;color:var(--accent-soft);font-weight:600}

/* photos (CSS stand-ins for imagery) */
.photo{background:var(--g);border-radius:14px;min-height:96px;position:relative}
.photo-d{--g:linear-gradient(180deg,#9bb7c6 0 22%,#2f4a24 22% 55%,#7a6a4d 55%)}
.photo-a{--g:linear-gradient(180deg,#f3c58a 0 25%,#5f8a2f 25% 70%,#44361f 70%)}
.photo-c{--g:linear-gradient(180deg,#e9c796 0 28%,#5b7a30 28% 72%,#3d3320 72%)}

/* pit cards */
.pit{display:flex;flex-direction:column;gap:12px}
.pit-main{display:grid;grid-template-columns:104px 1fr auto;gap:12px;align-items:start}
.pit-main .photo{aspect-ratio:1/1.1;grid-row:span 1}
.pit h3{font-size:1.05rem;line-height:1.2}
.tag{display:inline-block;font-size:.68rem;padding:2px 8px;border-radius:8px;background:#3a3633;margin-bottom:6px}
.meta{display:flex;flex-direction:column;gap:3px;font-size:.75rem;color:#c9bcb2;margin-top:4px}
.price{font-weight:700;margin-top:6px}
.pit-foot{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:6px;font-size:.78rem}
.pit-foot .row{justify-content:space-between}
.save{color:var(--muted)}.save[aria-pressed=true]{color:var(--accent)}.save[aria-pressed=true] svg{fill:currentColor}
.save svg{width:1.3em;height:1.3em}

/* map */
.map{flex:1;min-height:340px;border-radius:var(--radius);overflow:hidden;display:grid;grid-template-rows:auto 1fr auto;gap:12px;padding:14px;
  background:linear-gradient(180deg,#143c3c 0 55%,#0a1230 55%)}
.pills{display:flex;justify-content:space-between}
.pill{display:flex;gap:6px;align-items:center;padding:8px 14px;border-radius:999px;background:var(--accent);font-size:.8rem;font-weight:600}
.pins{display:grid;grid-template-columns:repeat(3,1fr);align-items:center;justify-items:center;text-align:center;font-size:.7rem;color:#dbe7e6}
.pin{display:flex;flex-direction:column;align-items:center;gap:4px}
.pin .drop{width:34px;height:34px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--accent);display:grid;place-items:center}
.pin .drop svg{transform:rotate(45deg)}
.you{width:22px;height:22px;border-radius:50%;background:var(--accent);border:3px solid #fff;box-shadow:0 0 0 12px rgba(40,110,255,.35)}

/* details */
.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hero{aspect-ratio:16/10;display:flex;justify-content:space-between;align-items:flex-start;padding:12px}
.hero .save{background:var(--accent);color:#fff;border-radius:50%;width:40px;height:40px;display:grid;place-items:center}
.hero .badge{align-self:flex-end;background:rgba(0,0,0,.6);padding:4px 10px;border-radius:10px;font-size:.7rem}
.gallery .photo{aspect-ratio:3/2;min-height:0}
.facts{display:flex;flex-direction:column;gap:14px}
.fact{display:grid;grid-template-columns:40px 1fr;gap:12px;font-size:.88rem}
.fact i{width:40px;height:40px;border:1px solid var(--line);border-radius:10px;display:grid;place-items:center;color:var(--accent)}
.fact small{display:block;color:var(--accent-soft);font-size:.72rem}
.fac-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:10px}
.fac-grid div{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 6px;border:1px solid var(--line);border-radius:12px;font-size:.78rem}
.fac-grid svg{color:var(--accent);width:1.5em;height:1.5em}
.warn{background:linear-gradient(160deg,#4d2a14,#2c170b)}
.warn h2{color:var(--accent-soft)}
section.stack{display:flex;flex-direction:column;gap:10px}

/* compare */
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.duo>div{display:flex;flex-direction:column;gap:4px}
.duo .photo{aspect-ratio:3/2;min-height:0;margin-bottom:6px}
details.card summary{display:flex;align-items:center;gap:10px;cursor:pointer;list-style:none;color:var(--accent-soft);font-weight:500}
details.card summary::-webkit-details-marker{display:none}
details.card summary::after{content:"";margin-left:auto;width:7px;height:7px;border:solid var(--accent);border-width:2px 2px 0 0;transform:rotate(-45deg);transition:transform .2s}
details.card[open] summary::after{transform:rotate(135deg)}
details.card .duo{border-top:1px solid var(--line);margin-top:12px;padding-top:12px;font-size:.82rem}
details.card .muted{margin-top:10px}
.comparing{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;background:linear-gradient(90deg,#4a2410,#2a1409)}
.comparing .photo{aspect-ratio:1;min-height:0}

/* profile */
.avatar{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);color:var(--accent);font-weight:700;background:#2a170c}
.list{padding:0}
.list li{display:flex;align-items:center;gap:12px;padding:14px;border-top:1px solid var(--line-soft);font-size:.9rem}
.list li:first-child{border:0}
.list svg{color:var(--accent)}
.list small{display:block;color:var(--muted);font-size:.72rem}
.list .go{margin-left:auto;color:var(--muted)}
.switch{margin-left:auto;appearance:none;width:44px;height:26px;border-radius:999px;background:#3a3633;position:relative;cursor:pointer;transition:background .2s}
.switch::after{content:"";position:absolute;inset:3px auto 3px 3px;width:20px;border-radius:50%;background:#f3b891;transition:transform .2s}
.switch:checked{background:var(--accent)}.switch:checked::after{transform:translateX(18px)}

/* auth */
.auth-card{padding:24px 20px;display:flex;flex-direction:column;gap:14px;background:rgba(30,18,12,.55);backdrop-filter:blur(12px);text-align:center}
.auth-card h1{font-size:1.8rem}
.auth-card .eyebrow{align-self:flex-start}
.or{display:flex;align-items:center;gap:12px;font-size:.85rem}
.or::before,.or::after{content:"";flex:1;height:1px;background:#6b5a50}
.auth-form{display:flex;flex-direction:column;gap:14px;text-align:left}
.auth-form .field{align-items:center}
.auth-form input{font-size:1.05rem}
.auth-form input::placeholder{color:var(--muted)}
.eye{display:grid;place-items:center;color:var(--muted);padding:4px}
.eye:hover,.eye[aria-pressed=true]{color:var(--text)}
.linkbtn{color:var(--accent);font-weight:600;padding:0;display:inline}
.go-btn{width:34px;height:34px;border-radius:50%;background:#5a2a14;display:grid;place-items:center;color:#fff}
.social{justify-content:center;gap:12px;font-size:1.05rem}

/* nav */
nav{display:grid;grid-template-columns:repeat(3,1fr);padding:10px var(--pad) calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line-soft);background:#0d0c0b}
nav button{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.78rem;color:var(--muted);font-weight:600}
nav span{display:grid;place-items:center;padding:8px 22px;border-radius:999px}
nav [aria-current=page]{color:var(--accent)}
nav [aria-current=page] span{background:var(--accent);color:#fff}
nav [aria-current=page]{color:var(--accent)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
/* OneMap (Leaflet) */
#onemap.map{display:block;flex:1;min-height:340px;padding:0;background:#0a1230;border-radius:var(--radius);overflow:hidden}
.leaflet-container{font:inherit}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#1c1512;color:var(--text)}
.leaflet-popup-content-wrapper{border:1px solid var(--line)}
.leaflet-popup-content .link{cursor:pointer}
.pit-marker{background:none;border:0}
.results{margin-top:-8px;border:1px solid var(--line);border-radius:14px;background:#14100e;overflow:hidden}
.results button{display:block;width:100%;padding:12px 14px;border-top:1px solid var(--line-soft);font-size:.85rem}
.results button:first-child{border-top:0}
.results button:hover,.results button:focus-visible{background:#2a1409}
.results small{display:block;color:var(--muted);font-size:.72rem}
.results .msg{padding:12px 14px;color:var(--muted);font-size:.82rem}
</style>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="flame" viewBox="0 0 24 24"><path d="M12 3c1 4 5 5.5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-6 1-9z"/></symbol>
  <symbol id="search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></symbol>
  <symbol id="bookmark" viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z"/></symbol>
  <symbol id="compass" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5z"/></symbol>
  <symbol id="user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></symbol>
  <symbol id="info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></symbol>
  <symbol id="pin" viewBox="0 0 24 24"><path d="M12 21s7-6 7-11a7 7 0 0 0-14 0c0 5 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></symbol>
  <symbol id="cal" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></symbol>
  <symbol id="users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2 20c0-4 3-6 7-6s7 2 7 6M17 5a3.5 3.5 0 0 1 0 7M22 20c0-3-2-5-4-5.5"/></symbol>
  <symbol id="drop" viewBox="0 0 24 24"><path d="M12 3s6 6 6 11a6 6 0 0 1-12 0c0-5 6-11 6-11z"/></symbol>
  <symbol id="bulb" viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10c1 1 1 2 1 3h6c0-1 0-2 1-3a6 6 0 0 0-4-10z"/></symbol>
  <symbol id="access" viewBox="0 0 24 24"><circle cx="12" cy="4.5" r="1.8"/><path d="M12 8v6h5l2 5M12 11H7M9 14a5 5 0 1 0 6 6"/></symbol>
  <symbol id="clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
  <symbol id="history" viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 3-6.2L4 8M4 4v4h4M12 8v4l3 2"/></symbol>
  <symbol id="chev" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
  <symbol id="swap" viewBox="0 0 24 24"><path d="M4 8h14l-3-3M20 16H6l3 3"/></symbol>
  <symbol id="out" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5H5V6h5"/></symbol>
  <symbol id="shield" viewBox="0 0 24 24"><path d="M12 3 5 6v6c0 4 3 7 7 9 4-2 7-5 7-9V6z"/></symbol>
  <symbol id="target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></symbol>
  <symbol id="eye" viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></symbol>
  <symbol id="eye-off" viewBox="0 0 24 24"><path d="M3 3l18 18M10.6 6.1A9.7 9.7 0 0 1 12 5c6 0 10 7 10 7a17 17 0 0 1-3.2 4M6.4 7.4C3.8 9.2 2 12 2 12s4 7 10 7c1.6 0 3-.4 4.3-1M9.9 9.9a3 3 0 0 0 4.2 4.2"/></symbol>
</svg>

<div class="app" id="app">
  <main id="view" tabindex="-1"></main>
  <nav id="nav" aria-label="Main" hidden>
    <button data-go="explore" data-tab="explore"><span><svg class="i"><use href="#compass"/></svg></span>Explore</button>
    <button data-go="saved" data-tab="saved"><span><svg class="i"><use href="#bookmark"/></svg></span>Saved</button>
    <button data-go="profile" data-tab="profile"><span><svg class="i"><use href="#user"/></svg></span>Profile</button>
  </nav>
</div>

<script>
'use strict';

/* ---------- data ---------- */
const PITS = {
  D: { id:'D', area:'Area D', rating:4.6, reviews:24, access:'Stair-free access', accessLong:'Stair-free approach. Confirm access and path conditions with the managing agency.', fac:['Toilets','Water','Lights'], photo:'d', coords:[1.3000, 103.9110] },
  A: { id:'A', area:'Area A', rating:4.4, reviews:18, access:'Paved access',      accessLong:'Paved approach. Confirm route conditions before travelling.',                  fac:['Toilets','Water','Lights'], photo:'a', coords:[1.3030, 103.9050] },
  C: { id:'C', area:'Area C', rating:4.6, reviews:24, access:'Paved access',      accessLong:'Paved approach. Confirm route conditions before travelling.',                  fac:['Toilets','Parking'],       photo:'c', coords:[1.3015, 103.9080] },
};
const PRICE = '$20/pit · 2hrs';
const FAC_ICON = { Toilets:'pin', Water:'drop', Lights:'bulb', Parking:'compass' };

const state = {
  saved: new Set(['D','A']),
  viewing: 'D',
  comparing: ['D','A'],
  baseline: 'D',
  listMode: 'list',
};

/* ---------- helpers ---------- */
const $ = (sel, root = document) => root.querySelector(sel);
const icon = (name, cls = '') => `<svg class="i ${cls}" aria-hidden="true"><use href="#${name}"/></svg>`;
const saveBtn = id => `<button class="save" data-save="${id}" aria-pressed="${state.saved.has(id)}" aria-label="Save ${PITS[id].area}">${icon('bookmark')}</button>`;
const notice = text => `<button class="notice" data-go="explore">${icon('info')}<span>${text}</span><span class="go">${icon('chev')}</span></button>`;
const search = () => `<label class="field">${icon('search')}<input type="search" placeholder="Search by park, area or facility" aria-label="Search by park, area or facility"></label>`;
const eyebrow = text => `<p class="eyebrow">${icon('flame')}${text}</p>`;

function pitCard(id, { cta = true, label = '' } = {}) {
  const p = PITS[id];
  return `
  <article class="card pit">
    <div class="pit-main">
      <div class="photo photo-${p.photo}" role="img" aria-label="Illustrative photo of ${p.area}"></div>
      <div>
        <span class="tag">Public Sector</span>
        <h3>East Coast Park ${p.area}</h3>
        <p class="rating">★ ${p.rating} (${p.reviews} demo reviews)</p>
        <p class="meta"><span>${icon('pin')} East Coast Park, ${p.area}</span><span>${icon('compass')} Nearest MRT: confirm route</span></p>
        <p class="price">${PRICE}</p>
      </div>
      ${saveBtn(id)}
    </div>
    ${cta ? `<div class="pit-foot">
      <div class="row accent">${icon('access')}<span style="color:var(--text)">${p.access}</span></div>
      <div class="row"><span>${p.fac.join(' · ')}</span><button class="link" data-pit="${id}">View Pit →</button></div>
    </div>` : ''}
    ${label}
  </article>`;
}

const exploreHeader = mode => `
  ${eyebrow('BBQ PIT FINDER')}
  <h1>Find your fire.</h1>
  ${search().replace('<input ','<input id="place-search" autocomplete="off" ')}
  <ul class="results" id="results" aria-live="polite" hidden></ul>
  <div class="filters">
    <button class="field">${icon('cal')}<span>Date and time</span></button>
    <button class="field">${icon('users')}<span>Number of guests</span></button>
  </div>
  <div class="row between">
    <span class="row" style="font-weight:600;font-size:.9rem">${icon('compass')}East Coast Park</span>
    <div class="toggle" role="group" aria-label="View mode">
      <button data-go="map" aria-pressed="${mode==='map'}">${icon('pin')}Map</button>
      <button data-go="explore" aria-pressed="${mode==='list'}">${icon('search')}List</button>
    </div>
  </div>`;

/* ---------- screens ---------- */
const screens = {
  login: () => {
    const signup = authUi.mode === 'signup';
    const askPassword = authUi.step === 'password';
    const switchText = signup
      ? 'Already have an account? <button type="button" class="linkbtn" data-auth-mode="login">Log in</button>'
      : "Don't have an account? <button type=\"button\" class=\"linkbtn\" data-auth-mode=\"signup\">Sign up</button>";
    return `
    <section class="card auth-card">
      ${eyebrow('BBQ PIT FINDER')}
      <h1>${signup ? 'Create account' : 'Welcome Back!'}</h1>
      <p class="sub">${signup ? 'Sign up to find your fire' : 'Sign in to your Account'}</p>
      <form id="login-form" class="auth-form" novalidate>
        <label class="field">
          <span style="flex:1"><small class="accent" style="display:block">Email</small>
          <input id="login-email" name="email" type="email" placeholder="example@email.com" autocomplete="email" value="${esc(authUi.email)}" required></span>
          ${askPassword ? '' : `<button class="go-btn" type="submit" aria-label="Continue">${icon('chev')}</button>`}
        </label>
        ${askPassword ? `
        <label class="field">
          <span style="flex:1"><small class="accent" style="display:block">Password</small>
          <input id="login-password" name="password" type="password" placeholder="password" autocomplete="${signup ? 'new-password' : 'current-password'}" required></span>
          <button type="button" class="eye" data-toggle-pw aria-label="Show password" aria-pressed="false">${icon('eye-off')}</button>
        </label>` : ''}
        <p id="auth-msg" class="sub" role="status" aria-live="polite"></p>
        ${askPassword ? `<p class="sub" style="text-align:center">${switchText}</p>
        <button class="btn" type="submit">${signup ? 'Sign up' : 'Log In'}</button>` : ''}
      </form>
      ${askPassword ? '' : `
      <p class="or">OR</p>
      <button class="field social" data-auth="google"><strong style="color:#4285f4">G</strong>Continue with Google</button>
      <button class="field social" data-auth="apple"><strong style="color:#fff"></strong>Continue with Apple</button>
      <p class="sub">${switchText}</p>`}
    </section>`;
  },

  explore: () => `

/* ---------- OneMap config + search ---------- */
// Your deployed Supabase Edge Function (it holds the OneMap login; none is stored here)
const TOKEN_URL = 'https://xatgzoturyuygtgukegt.supabase.co/functions/v1/onemap-token';
let onemapToken = null;

async function getToken(force = false) {
  if (onemapToken && !force) return onemapToken;
  let res;
  try {
    // The publishable key is public by design; Supabase's gateway asks for it on function calls
    res = await fetch(TOKEN_URL, { headers: { apikey: SUPABASE_KEY } });
  } catch (err) { throw new Error('token-network'); }          // blocked, offline, or CORS
  if (!res.ok) throw new Error('token-' + res.status);
  const data = await res.json().catch(() => ({}));
  if (!data.token) throw new Error('token-empty');
  onemapToken = data.token;
  return onemapToken;
}

async function searchPlace(query, retry = true) {
  const url = 'https://www.onemap.gov.sg/api/common/elastic/search?searchVal=' +
    encodeURIComponent(query) + '&returnGeom=Y&getAddrDetails=Y&pageNum=1';
  let res;
  try { res = await fetch(url, { headers: { Authorization: await getToken() } }); }
  catch (err) { if (String(err.message).startsWith('token')) throw err; throw new Error('search-network'); }
  if (res.status === 401 && retry) { await getToken(true); return searchPlace(query, false); }
  if (!res.ok) throw new Error('search-' + res.status);
  return (await res.json()).results || [];
}

let found = [];          // current search results
let focusPoint = null;   // place to show once the map is ready
let searchMarker = null;

function showPlace(r) {
  focusPoint = { latlng: [Number(r.LATITUDE), Number(r.LONGITUDE)], label: r.BUILDING && r.BUILDING !== 'NIL' ? r.BUILDING : r.SEARCHVAL };
  if (map) applyFocus(); else go('map');   // switches to Map, initMap() applies the focus
}

function applyFocus() {
  if (!map || !focusPoint) return;
  searchMarker?.remove();
  searchMarker = L.marker(focusPoint.latlng).addTo(map).bindPopup(focusPoint.label).openPopup();
  map.flyTo(focusPoint.latlng, 17);
  focusPoint = null;
}

function renderResults(items, message) {
  const box = document.getElementById('results');
  if (!box) return;
  found = items;
  box.hidden = false;
  box.innerHTML = message ? `<li class="msg">${message}</li>` :
    items.slice(0, 5).map((r, i) => `<li><button data-result="${i}">${r.BUILDING && r.BUILDING !== 'NIL' ? r.BUILDING : r.SEARCHVAL}<small>${r.ADDRESS}</small></button></li>`).join('');
}

let searchTimer;
document.addEventListener('input', e => {
  if (e.target.id !== 'place-search') return;
  clearTimeout(searchTimer);
  const q = e.target.value.trim();
  if (q.length < 3) { const b = document.getElementById('results'); if (b) b.hidden = true; return; }
  searchTimer = setTimeout(async () => {
    renderResults([], 'Searching OneMap…');
    try {
      const items = await searchPlace(q);
      renderResults(items, items.length ? '' : 'No places found. Try a different name or postal code.');
    } catch (err) {
      console.error('Place search failed:', err);
      const m = String(err.message);
      renderResults([], m === 'token-network' ? "Can't reach the token service. Check the onemap-token function is deployed (see Console)."
        : m === 'token-401' || m === 'token-403' ? 'Token service refused the request. Check Verify JWT and the apikey (see Console).'
        : m === 'token-404' ? 'Token function not found. Deploy a function named onemap-token.'
        : m.startsWith('token-') ? 'Could not get a OneMap token. Check the function secrets and logs.'
        : m === 'search-429' ? 'OneMap is busy. Try again in a moment.'
        : m.startsWith('search-') ? 'OneMap search failed (' + m.slice(7) + '). Try again.'
        : 'Search is unavailable right now. Check your connection and try again.');
    }
  }, 400);
});

document.addEventListener('click', e => {

});

/* ---------- OneMap (Leaflet) ---------- */
let map = null;

function destroyMap() { if (map) { map.remove(); map = null; searchMarker = null; } }

function initMap() {
  const el = document.getElementById('onemap');
  if (!el) return;
  if (typeof L === 'undefined') {
    el.innerHTML = '<p class="card sub" style="margin:14px">Map library failed to load. Check your internet connection.</p>';
    return;
  }
  map = L.map(el, { zoomControl: false }).setView([1.3012, 103.9080], 15);
  L.control.zoom({ position: 'bottomright' }).addTo(map);

  L.tileLayer('https://www.onemap.gov.sg/maps/tiles/Default/{z}/{x}/{y}.png', {
    detectRetina: true, minZoom: 11, maxZoom: 19,
    attribution: '<a href="https://www.onemap.gov.sg/" target="_blank" rel="noopener">OneMap</a>&nbsp;&copy;&nbsp;contributors&nbsp;&#124;&nbsp;<a href="https://www.sla.gov.sg/" target="_blank" rel="noopener">Singapore Land Authority</a>'
  }).addTo(map);

  Object.values(PITS).forEach(p => {
    const icon = L.divIcon({
      className: 'pit-marker', iconSize: [34, 34], iconAnchor: [17, 34], popupAnchor: [0, -34],
      html: '<span class="pin"><span class="drop"><svg class="i"><use href="#flame"/></svg></span></span>'
    });
    L.marker(p.coords, { icon, title: 'East Coast Park ' + p.area }).addTo(map)
      .bindPopup(`<strong>East Coast Park ${p.area}</strong><br>${p.access}<br><button class="link" data-pit="${p.id}">View pit →</button>`);
  });
  setTimeout(() => map && map.invalidateSize(), 150);
  applyFocus();
}

/* ---------- Supabase auth ---------- */
// The publishable key is designed to be public. NEVER put a secret/service_role key in front-end code.
const SUPABASE_URL = 'https://xatgzoturyuygtgukegt.supabase.co';
const SUPABASE_KEY = 'sb_publishable_k6u5Nka26BQpQOP4R1H6Zw_lJ4PBUpT';
const sb = window.supabase?.createClient(SUPABASE_URL, SUPABASE_KEY);
const REDIRECT = location.origin + location.pathname;   // must be allowed in Supabase > Auth > URL Configuration

let session = null;
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const displayName = () => session?.user?.user_metadata?.full_name || session?.user?.email?.split('@')[0] || 'Guest';
const initials = () => displayName().split(/[\s._-]+/).filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase() || '?';
const authMsg = (text, isError = false) => {
  const el = document.getElementById('auth-msg');
  if (el) { el.textContent = text; el.style.color = isError ? '#ff8a6a' : 'var(--accent-soft)'; }
};

const authUi = { step: 'email', mode: 'login', email: '' };   // step: 'email' -> 'password'
const rerenderLogin = () => {
  go('login', { push: false });
  document.getElementById(authUi.step === 'password' ? 'login-password' : 'login-email')?.focus();
};

document.addEventListener('submit', async e => {
  if (e.target.id !== 'login-form') return;
  e.preventDefault();
  const email = document.getElementById('login-email').value.trim();
  if (!/^\S+@\S+\.\S+$/.test(email)) return authMsg('Enter a valid email address, like name@example.com.', true);
  authUi.email = email;

  // Step 1: email entered -> ask for the password
  if (authUi.step === 'email') { authUi.step = 'password'; return rerenderLogin(); }

  // Step 2: password entered -> log in or sign up
  const password = document.getElementById('login-password').value;
  const signup = authUi.mode === 'signup';
  if (!password) return authMsg('Enter your password.', true);
  if (signup && password.length < 8) return authMsg('Use at least 8 characters for your password.', true);

  const buttons = e.target.querySelectorAll('button'); buttons.forEach(b => b.disabled = true);
  authMsg(signup ? 'Creating your account…' : 'Logging in…');

  if (signup) {
    const { data, error } = await sb.auth.signUp({ email, password, options: { emailRedirectTo: REDIRECT } });
    buttons.forEach(b => b.disabled = false);
    if (error) authMsg(error.message, true);
    else if (data.user && data.user.identities && data.user.identities.length === 0)
      authMsg('That email already has an account. Try logging in.', true);
    else if (!data.session) authMsg('Account created. Check your email to confirm it, then log in.');
    // if a session came back, onAuthStateChange takes the user to Explore
  } else {
    const { error } = await sb.auth.signInWithPassword({ email, password });
    buttons.forEach(b => b.disabled = false);
    if (error) authMsg(error.status === 400 ? 'Incorrect email or password.' : error.message, true);
  }
});

document.addEventListener('click', async e => {
  const oauth = e.target.closest('[data-auth]');
  if (oauth) {
    const { error } = await sb.auth.signInWithOAuth({ provider: oauth.dataset.auth, options: { redirectTo: REDIRECT } });
    if (error) authMsg(error.message, true);
  }
  const modeBtn = e.target.closest('[data-auth-mode]');
  if (modeBtn) { authUi.mode = modeBtn.dataset.authMode; rerenderLogin(); }
  const eye = e.target.closest('[data-toggle-pw]');
  if (eye) {
    const input = document.getElementById('login-password');
    const show = input.type === 'password';
    input.type = show ? 'text' : 'password';
    eye.setAttribute('aria-pressed', String(show));
    eye.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
    eye.querySelector('use').setAttribute('href', show ? '#eye' : '#eye-off');
  }
  if (e.target.closest('[data-signout]')) await sb.auth.signOut();
  if (e.target.closest('[data-edit-name]')) {
    const name = prompt('Your name', displayName());
    if (name && name.trim()) await sb.auth.updateUser({ data: { full_name: name.trim() } });
  }
});

/* ---------- router ---------- */
const view = $('#view'), nav = $('#nav');
const history = [];

function go(route, { push = true } = {}) {
  if (!screens[route] || (!session && route !== 'login')) route = 'login';
  if (push) history.push(route);
  destroyMap();
  view.innerHTML = screens[route]();
  view.className = route === 'login' ? 'auth' : '';
  view.scrollTop = 0;
  nav.hidden = route === 'login';
  nav.querySelectorAll('[data-tab]').forEach(b => {
    if (b.dataset.tab === TAB[route]) b.setAttribute('aria-current', 'page');
    else b.removeAttribute('aria-current');
  });
  view.dataset.route = route;
  view.focus({ preventScroll: true });
  if (route === 'map') requestAnimationFrame(initMap);
}

function back() {
  history.pop();
  go(history[history.length - 1] || 'explore', { push: false });
}

/* ---------- events (delegated) ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-go],[data-save],[data-pit],[data-compare],[data-back]');
  if (!t) return;
  if (t.dataset.save) {
    const id = t.dataset.save;
    state.saved.has(id) ? state.saved.delete(id) : state.saved.add(id);
    // refresh in place so scroll position is kept
    const top = view.scrollTop; go(view.dataset.route, { push: false }); view.scrollTop = top;
  } else if (t.dataset.pit) {
    state.viewing = t.dataset.pit; go('pit');
  } else if (t.dataset.compare) {
    state.comparing = [state.baseline, t.dataset.compare]; go('compare');
  } else if ('back' in t.dataset) {
    back();
  } else {
    if (t.dataset.go === 'search') state.baseline = state.viewing;
    go(t.dataset.go);
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.matches('article[data-pit]')) e.target.click();
});

if (!sb) {
  go('login');
  authMsg('Sign-in could not load. Check your internet connection and reload.', true);
} else {
  sb.auth.onAuthStateChange((event, s) => {
    session = s;
    const route = view.dataset.route;
    if (event === 'INITIAL_SESSION') go(s ? 'explore' : 'login', { push: false });
    else if (event === 'SIGNED_IN' && route === 'login') go('explore');
    else if (event === 'SIGNED_OUT') { history.length = 0; Object.assign(authUi, { step: 'email', mode: 'login', email: '' }); go('login'); }
    else if (event === 'USER_UPDATED' && route) go(route, { push: false });
  });
}
