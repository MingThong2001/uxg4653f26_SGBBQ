<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BBQ Pit Finder</title>
<style>
:root{
  --bg:#0d0c0b;--card-a:#2b1608;--card-b:#151210;--line:#4a2a15;--line-soft:#2c2420;
  --accent:#ff6a1a;--accent-soft:#ff9a5c;--head:#ffc9a0;--text:#f4e8de;--muted:#9a8c82;
  --radius:18px;--gap:16px;--pad:20px;
  font-family:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:dark;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:#050505;color:var(--text);line-height:1.4;display:flex;justify-content:center}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
:focus-visible{outline:2px solid var(--accent-soft);outline-offset:2px}
ul{list-style:none;padding:0}
.app{width:100%;max-width:440px;min-height:100dvh;display:flex;flex-direction:column;background:var(--bg);
  padding-top:env(safe-area-inset-top,0px)}
@media(min-width:560px){.app{margin:24px 0;min-height:0;height:min(900px,calc(100dvh - 48px));border-radius:36px;
  border:1px solid #2a2523;overflow:hidden}}
main{flex:1;overflow-y:auto;padding:var(--pad);display:flex;flex-direction:column;gap:var(--gap)}
main.auth{justify-content:center;background:radial-gradient(120% 70% at 0% 100%,#a86f0b,transparent 55%),
  radial-gradient(90% 60% at 100% 20%,#4a1a08,transparent 60%),#0d0c0b}

/* type */
.eyebrow{display:flex;align-items:center;gap:6px;color:var(--accent);font-size:.75rem;font-weight:600}
h1{color:var(--head);font-size:clamp(1.7rem,7vw,2rem);line-height:1.15;font-weight:800}
h2{font-size:1.1rem;font-weight:600}
.sub{font-size:.9rem}
.muted{color:var(--muted);font-size:.75rem}
.accent{color:var(--accent)}
.rating{color:var(--accent);font-size:.78rem}
svg.i{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* cards + controls */
.card{background:linear-gradient(160deg,var(--card-a),var(--card-b));border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.field{display:flex;align-items:center;gap:10px;padding:14px;border:1px solid var(--line);border-radius:14px;background:#14100e;color:var(--muted);width:100%}
.field svg{color:var(--accent)}
.field input{flex:1;min-width:0;background:none;border:0;color:var(--text);font:inherit;outline:0}
.field:focus-within{border-color:var(--accent)}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{display:flex;justify-content:center;align-items:center;gap:8px;padding:14px;border-radius:12px;background:var(--accent);color:#fff;font-weight:700;width:100%}
.btn.sm{width:auto;padding:8px 14px;font-size:.85rem}
.link{color:var(--accent);font-weight:600;font-size:.82rem}
.chip{padding:8px 14px;border-radius:999px;background:#1c1816;border:1px solid var(--line-soft);font-size:.8rem}
.chips{display:flex;gap:10px;flex-wrap:wrap}
.notice{display:flex;align-items:center;gap:10px;width:100%;font-size:.82rem;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:linear-gradient(90deg,#4a2410,#2a1409)}
.notice svg{color:var(--accent)}.notice .go{margin-left:auto}
.toggle{display:flex;padding:3px;border-radius:999px;background:#201b18}
.toggle button{display:flex;gap:6px;align-items:center;padding:7px 14px;border-radius:999px;font-size:.85rem;color:var(--muted)}
.toggle [aria-pressed=true]{background:var(--accent);color:#fff;font-weight:600}
.top{display:flex;justify-content:space-between;align-items:center;color:var(--accent-soft);font-weight:600}

/* photos */
.photo{background:var(--g);border-radius:14px;min-height:96px;position:relative}
.photo-d{--g:linear-gradient(180deg,#9bb7c6 0 22%,#2f4a24 22% 55%,#7a6a4d 55%)}
.photo-a{--g:linear-gradient(180deg,#f3c58a 0 25%,#5f8a2f 25% 70%,#44361f 70%)}
.photo-c{--g:linear-gradient(180deg,#e9c796 0 28%,#5b7a30 28% 72%,#3d3320 72%)}

/* pit cards */
.pit{display:flex;flex-direction:column;gap:12px}
.pit-main{display:grid;grid-template-columns:104px 1fr auto;gap:12px;align-items:start}
.pit-main .photo{aspect-ratio:1/1.1;grid-row:span 1}
.pit h3{font-size:1.05rem;line-height:1.2}
.tag{display:inline-block;font-size:.68rem;padding:2px 8px;border-radius:8px;background:#3a3633;margin-bottom:6px}
.meta{display:flex;flex-direction:column;gap:3px;font-size:.75rem;color:#c9bcb2;margin-top:4px}
.price{font-weight:700;margin-top:6px}
.pit-foot{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:6px;font-size:.78rem}
.pit-foot .row{justify-content:space-between}
.save{color:var(--muted)}.save[aria-pressed=true]{color:var(--accent)}.save[aria-pressed=true] svg{fill:currentColor}
.save svg{width:1.3em;height:1.3em}

/* map */
#onemap.map{display:block;flex:1;min-height:340px;padding:0;background:#0a1230;border-radius:var(--radius);overflow:hidden}
.leaflet-container{font:inherit}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#1c1512;color:var(--text)}
.leaflet-popup-content-wrapper{border:1px solid var(--line)}
.leaflet-popup-content .link{cursor:pointer}
.pit-marker{background:none;border:0}

.results{margin-top:-8px;border:1px solid var(--line);border-radius:14px;background:#14100e;overflow-y:auto;min-height:180px;max-height:340px;z-index:100;position:relative}
.results button{display:block;width:100%;padding:14px 16px;border-top:1px solid var(--line-soft);font-size:.9rem}
.results button:first-child{border-top:0}
.results button:hover,.results button:focus-visible{background:#2a1409}
.results small{display:block;color:var(--muted);font-size:.78rem;margin-top:2px}
.results .msg{padding:14px 16px;color:var(--muted);font-size:.88rem}

/* details */
.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hero{aspect-ratio:16/10;display:flex;justify-content:space-between;align-items:flex-start;padding:12px}
.hero .save{background:var(--accent);color:#fff;border-radius:50%;width:40px;height:40px;display:grid;place-items:center}
.hero .badge{align-self:flex-end;background:rgba(0,0,0,.6);padding:4px 10px;border-radius:10px;font-size:.7rem}
.gallery .photo{aspect-ratio:3/2;min-height:0}
.facts{display:flex;flex-direction:column;gap:14px}
.fact{display:grid;grid-template-columns:40px 1fr;gap:12px;font-size:.88rem}
.fact i{width:40px;height:40px;border:1px solid var(--line);border-radius:10px;display:grid;place-items:center;color:var(--accent)}
.fact small{display:block;color:var(--accent-soft);font-size:.72rem}
.fac-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:10px}
.fac-grid div{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 6px;border:1px solid var(--line);border-radius:12px;font-size:.78rem}
.fac-grid svg{color:var(--accent);width:1.5em;height:1.5em}
.warn{background:linear-gradient(160deg,#4d2a14,#2c170b)}
.warn h2{color:var(--accent-soft)}
section.stack{display:flex;flex-direction:column;gap:10px}

/* profile */
.avatar{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);color:var(--accent);font-weight:700;background:#2a170c}
.list{padding:0}
.list li{display:flex;align-items:center;gap:12px;padding:14px;border-top:1px solid var(--line-soft);font-size:.9rem}
.list li:first-child{border:0}
.list svg{color:var(--accent)}
.list small{display:block;color:var(--muted);font-size:.72rem}
.list .go{margin-left:auto;color:var(--muted)}
.switch{margin-left:auto;appearance:none;width:44px;height:26px;border-radius:999px;background:#3a3633;position:relative;cursor:pointer;transition:background .2s}
.switch::after{content:"";position:absolute;inset:3px auto 3px 3px;width:20px;border-radius:50%;background:#f3b891;transition:transform .2s}
.switch:checked{background:var(--accent)}.switch:checked::after{transform:translateX(18px)}

/* auth */
.auth-card{padding:24px 20px;display:flex;flex-direction:column;gap:14px;background:rgba(30,18,12,.55);backdrop-filter:blur(12px);text-align:center}
.auth-card h1{font-size:1.8rem}
.auth-card .eyebrow{align-self:flex-start}
.or{display:flex;align-items:center;gap:12px;font-size:.85rem}
.or::before,.or::after{content:"";flex:1;height:1px;background:#6b5a50}
.auth-form{display:flex;flex-direction:column;gap:14px;text-align:left}
.auth-form .field{align-items:center}
.auth-form input{font-size:1.05rem}
.auth-form input::placeholder{color:var(--muted)}
.eye{display:grid;place-items:center;color:var(--muted);padding:4px}
.eye:hover,.eye[aria-pressed=true]{color:var(--text)}
.linkbtn{color:var(--accent);font-weight:600;padding:0;display:inline}
.go-btn{width:34px;height:34px;border-radius:50%;background:#5a2a14;display:grid;place-items:center;color:#fff}
.social{justify-content:center;gap:12px;font-size:1.05rem}

/* nav */
nav{display:grid;grid-template-columns:repeat(3,1fr);padding:10px var(--pad) calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line-soft);background:#0d0c0b}
nav button{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.78rem;color:var(--muted);font-weight:600}
nav span{display:grid;place-items:center;padding:8px 22px;border-radius:999px}
nav [aria-current=page]{color:var(--accent)}
nav [aria-current=page] span{background:var(--accent);color:#fff}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="flame" viewBox="0 0 24 24"><path d="M12 3c1 4 5 5.5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-6 1-9z"/></symbol>
  <symbol id="search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></symbol>
  <symbol id="bookmark" viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z"/></symbol>
  <symbol id="compass" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5z"/></symbol>
  <symbol id="user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></symbol>
  <symbol id="info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></symbol>
  <symbol id="pin" viewBox="0 0 24 24"><path d="M12 21s7-6 7-11a7 7 0 0 0-14 0c0 5 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></symbol>
  <symbol id="cal" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></symbol>
  <symbol id="users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2 20c0-4 3-6 7-6s7 2 7 6M17 5a3.5 3.5 0 0 1 0 7M22 20c0-3-2-5-4-5.5"/></symbol>
  <symbol id="drop" viewBox="0 0 24 24"><path d="M12 3s6 6 6 11a6 6 0 0 1-12 0c0-5 6-11 6-11z"/></symbol>

  <symbol id="access" viewBox="0 0 24 24"><circle cx="12" cy="4.5" r="1.8"/><path d="M12 8v6h5l2 5M12 11H7M9 14a5 5 0 1 0 6 6"/></symbol>
  <symbol id="clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
  <symbol id="history" viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 3-6.2L4 8M4 4v4h4M12 8v4l3 2"/></symbol>
  <symbol id="chev" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>

  <symbol id="out" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5H5V6h5"/></symbol>
  <symbol id="shield" viewBox="0 0 24 24"><path d="M12 3 5 6v6c0 4 3 7 7 9 4-2 7-5 7-9V6z"/></symbol>
  <symbol id="target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></symbol>
  <symbol id="eye" viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></symbol>
  <symbol id="eye-off" viewBox="0 0 24 24"><path d="M3 3l18 18M10.6 6.1A9.7 9.7 0 0 1 12 5c6 0 10 7 10 7a17 17 0 0 1-3.2 4M6.4 7.4C3.8 9.2 2 12 2 12s4 7 10 7c1.6 0 3-.4 4.3-1M9.9 9.9a3 3 0 0 0 4.2 4.2"/></symbol>
  <symbol id="wifi" viewBox="0 0 24 24"><path d="M5 12.55a11 11 0 0 1 14.08 0M1.42 9a16 16 0 0 1 21.16 0M8.53 16.11a6 6 0 0 1 6.95 0M12 20h.01"/></symbol>
</svg>

<div class="app" id="app">
  <main id="view" tabindex="-1"></main>
  <nav id="nav" aria-label="Main" hidden>
    <button data-go="explore" data-tab="explore"><span><svg class="i"><use href="#compass"/></svg></span>Explore</button>
    <button data-go="saved" data-tab="saved"><span><svg class="i"><use href="#bookmark"/></svg></span>Saved</button>
    <button data-go="profile" data-tab="profile"><span><svg class="i"><use href="#user"/></svg></span>Profile</button>
  </nav>
</div>

<script>
'use strict';

let PITS = {};
let pitsLoadMsg = '';
const PRICE = '$20/pit · 2hrs';
const FAC_ICON = { Toilets:'pin', Water:'drop', Lights:'bulb', Parking:'compass', WiFi:'wifi' };

const state = {
  saved: new Set(),
  viewing: null,
  comparing: [],
  baseline: null,
  searchQuery: '',
  savedSearchQuery: '', 
  listMode: 'list',
  recent: [] 
};

const MRT_STATIONS = [
  { name: "Pasir Ris MRT", exit: "Exit B", coords: [1.372886, 103.949136] },
  { name: "Changi Airport MRT", exit: "Exit A", coords: [1.3573, 103.9897] },
  { name: "East Coast / Marine Parade MRT", exit: "Exit 4", coords: [1.304566, 103.907627] },
  { name: "Mountbatten MRT", exit: "Exit B", coords: [1.306046, 103.883248] },
  { name: "Clementi MRT", exit: "Exit A", coords: [1.315374, 103.764982] },
  { name: "Jurong East MRT", exit: "Exit C", coords: [1.3332, 103.7423] },
  { name: "Ang Mo Kio MRT", exit: "Exit D", coords: [1.3699, 103.8495] },
  { name: "Woodlands MRT", exit: "Exit 1", coords: [1.4369, 103.7865] }
];

function calculateNearestMRT(pitLat, pitLng) {
  if (!pitLat || !pitLng) return "Confirm route";
  let nearest = MRT_STATIONS[0];
  let minDistance = Infinity;

  MRT_STATIONS.forEach(mrt => {
    const dLat = (mrt.coords[0] - pitLat) * (Math.PI / 180);
    const dLng = (mrt.coords[1] - pitLng) * (Math.PI / 180);
    const a = Math.sin(dLat / 2) ** 2 + Math.cos(pitLat * (Math.PI / 180)) * Math.cos(mrt.coords[0] * (Math.PI / 180)) * Math.sin(dLng / 2) ** 2;
    const distance = 6371 * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
    if (distance < minDistance) { minDistance = distance; nearest = mrt; }
  });

  return `${nearest.name} (${nearest.exit}) · ~${Math.round(minDistance * 1000)}m`;
}

const WIFI_HOTSPOTS = [
  { name: "Bukit Batok CC WiFi", coords: [1.3501908, 103.7475144] },
  { name: "Northpoint Drive WiFi", coords: [1.4280358, 103.8360921] },
  { name: "Waterloo St WiFi", coords: [1.3001966, 103.8529753] },
  { name: "Upper Pickering St WiFi", coords: [1.2863294, 103.8464793] },
  { name: "Anchorvale Canteen WiFi", coords: [1.3992286, 103.8896539] },
  { name: "Telok Blangah WiFi", coords: [1.2744687, 103.8214741] },
  { name: "Woodlands Ave 1 WiFi", coords: [1.4274928, 103.7922408] },
  { name: "Tampines Industrial WiFi", coords: [1.3603925, 103.9296947] }
];

function hasNearbyWiFi(pitLat, pitLng) {
  if (!pitLat || !pitLng) return false;
  for (let i = 0; i < WIFI_HOTSPOTS.length; i++) {
    const wifi = WIFI_HOTSPOTS[i];
    const dLat = (wifi.coords[0] - pitLat) * (Math.PI / 180);
    const dLng = (wifi.coords[1] - pitLng) * (Math.PI / 180);
    const a = Math.sin(dLat / 2) ** 2 + Math.cos(pitLat * (Math.PI / 180)) * Math.cos(wifi.coords[0] * (Math.PI / 180)) * Math.sin(dLng / 2) ** 2;
    if (6371 * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a))) * 1000 <= 50) return true;
  }
  return false;
}

const $ = (sel, root = document) => root.querySelector(sel);
const icon = (name, cls = '') => `<svg class="i ${cls}" aria-hidden="true"><use href="#${name}"/></svg>`;
const saveBtn = id => `<button class="save" data-save="${id}" aria-pressed="${state.saved.has(id)}" aria-label="Save ${PITS[id]?.area || ''}">${icon('bookmark')}</button>`;
const notice = text => `<button class="notice" data-go="explore">${icon('info')}<span>${text}</span><span class="go">${icon('chev')}</span></button>`;
const search = () => `<label class="field">${icon('search')}<input type="search" placeholder="Search by area or facility (e.g. Woodlands, WiFi)" aria-label="Search by area or facility"></label>`;
const eyebrow = text => `<p class="eyebrow">${icon('flame')}${text}</p>`;

function pitCard(id, { cta = true, label = '' } = {}) {
  const p = PITS[id];
  if (!p) return '';
  return `
  <article class="card pit">
    <div class="pit-main">
      <div class="photo photo-${p.photo}" role="img" aria-label="Photo of ${p.area}"></div>
      <div>
        <span class="tag">Public Sector</span>
        <h3>${p.area}</h3>
        <p class="rating">★ ${p.rating} (${p.reviews} demo reviews)</p>
        <p class="meta">
          <span>${icon('pin')} ${p.area}, Singapore</span>
          <span>${icon('compass')} Nearest MRT: ${p.nearestMRT || 'Confirm route'}</span>
        </p>
        <p class="price">${p.price || PRICE}</p>
      </div>
      ${saveBtn(id)}
    </div>
    ${cta ? `<div class="pit-foot">
      <div class="row accent">${icon('access')}<span style="color:var(--text)">${p.access}</span></div>
      <div class="row"><span>${p.fac.join(' · ')}</span><button class="link" data-pit="${id}">View Pit →</button></div>
    </div>` : ''}
    ${label}
  </article>`;
}

const exploreHeader = () => `
  ${eyebrow('BBQ PIT FINDER')}
  <h1>Find your fire.</h1>
  ${search().replace('<input ','<input id="place-search" autocomplete="off" value="' + esc(state.searchQuery) + '" ')}
  <ul class="results" id="results" aria-live="polite" hidden></ul>
  <div class="filters">
    <button class="field">${icon('cal')}<span>Date and time</span></button>
    <button class="field">${icon('users')}<span>Number of guests</span></button>
  </div>
  <div class="row between">
    <span class="row" style="font-weight:600;font-size:.9rem">${icon('compass')}Singapore Parks (${Object.keys(PITS).length} Pits)</span>
    <div class="toggle" role="group" aria-label="View mode">
      <button data-mode="map" aria-pressed="${state.listMode === 'map'}">${icon('pin')}Map</button>
      <button data-mode="list" aria-pressed="${state.listMode === 'list'}">${icon('search')}List</button>
    </div>
  </div>`;

async function fetchWeatherForecast() {
  try {
    const res = await fetch("https://api-open.data.gov.sg/v2/real-time/api/twenty-four-hr-forecast");
    const json = await res.json();
    if (json.code === 0 && json.data && json.data.records.length > 0) {
      const record = json.data.records[0];
      return { general: record.general.forecast.text, tempLow: record.general.temperature.low, tempHigh: record.general.temperature.high, humidityLow: record.general.relativeHumidity.low, humidityHigh: record.general.relativeHumidity.high };
    }
  } catch (err) { console.error("Weather API Error:", err); }
  return null;
}

async function fetchCarparkAvailability() {
  try {
    const res = await fetch("https://api.data.gov.sg/v1/transport/carpark-availability");
    const json = await res.json();
    if (json.items && json.items.length > 0) return json.items[0].carpark_data;
  } catch (err) { console.error("Carpark API Error:", err); }
  return [];
}

async function loadPitWeather() {
  const weatherText = document.getElementById('weather-text');
  if (!weatherText) return;
  const weather = await fetchWeatherForecast();
  weatherText.innerHTML = weather ? `🌤️ <strong>${weather.general}</strong><br>Temp: ${weather.tempLow}°C – ${weather.tempHigh}°C | Humidity: ${weather.humidityLow}%–${weather.humidityHigh}%` : "Live weather data currently unavailable.";
}

async function loadSupabasePits() {
  try {
    if (!sb) return;
    let allData = [], page = 0, pageSize = 1000, fetchMore = true;
    while (fetchMore) {
      const { data, error } = await sb.from("pits_table").select("*").range(page * pageSize, (page + 1) * pageSize - 1);
      if (error) break;
      if (data && data.length > 0) {
        allData = allData.concat(data);
        if (data.length < pageSize) fetchMore = false; else page++;
      } else fetchMore = false;
    }

    if (allData.length > 0) {
      const newPits = {};
      allData.forEach((pit, index) => {
        const pitId = pit.id ? String(pit.id).trim() : `pit_${index + 1}`;
        let parsedFacilities = ['Toilets', 'Water'];
        if (Array.isArray(pit.facilities)) parsedFacilities = pit.facilities;
        else if (typeof pit.facilities === 'string') {
          parsedFacilities = pit.facilities.replace(/^\{|\}$/g, '').split(',').map(f => f.trim().replace(/^"\vert{}"$/g, '')).filter(Boolean);
        }
        const lat = parseFloat(pit.latitude), lng = parseFloat(pit.longitude);
        if (hasNearbyWiFi(lat, lng) && !parsedFacilities.includes('WiFi')) parsedFacilities.push('WiFi');

        newPits[pitId] = {
          id: pitId,
          area: pit.area || `Pit ${pitId}`,
          rating: pit.rating || 4.5,
          reviews: pit.reviews || 0,
          access: pit.access || 'Paved access',
          accessLong: pit.access_long || 'Paved approach.',
          fac: parsedFacilities,
          photo: ['a','c','d'].includes(pit.photo_key) ? pit.photo_key : ['d','a','c'][index % 3],
          price: pit.price || PRICE,
          coords: [!isNaN(lat) ? lat : 1.3000, !isNaN(lng) ? lng : 103.9110],
          nearestMRT: calculateNearestMRT(lat, lng)
        };
      });
      PITS = newPits;
      const allIds = Object.keys(PITS);
      if (allIds.length > 0 && (!state.viewing || !PITS[state.viewing])) {
        state.viewing = allIds[0];
        state.baseline = allIds[0];
        state.saved = new Set([allIds[0]]);
      }
      const currentRoute = document.getElementById('view')?.dataset?.route;
      if (currentRoute === 'explore' || currentRoute === 'map') go(currentRoute, { push: false });
    }
  } catch (err) { console.error("Supabase Pits Exception:", err); }
}

let map = null;
function destroyMap() { if (map) { map.remove(); map = null; } }

function initMap() {
  const el = document.getElementById('onemap');
  if (!el || typeof L === 'undefined') return;
  
  if (!map) {
    map = L.map(el, { zoomControl: false }).setView([1.3521, 103.8198], 11);
    L.control.zoom({ position: 'bottomright' }).addTo(map);
    L.tileLayer('https://www.onemap.gov.sg/maps/tiles/Default/{z}/{x}/{y}.png', { detectRetina: true, minZoom: 9, maxZoom: 19, attribution: '<a href="https://www.onemap.gov.sg/" target="_blank" rel="noopener">OneMap</a>' }).addTo(map);
  }

  map.eachLayer(layer => {
    if (layer instanceof L.CircleMarker) {
      map.removeLayer(layer);
    }
  });

  const bounds = [];
  const q = state.searchQuery.toLowerCase().trim();
  Object.values(PITS).forEach(p => {
    if (q && !p.area.toLowerCase().includes(q) && !p.fac.some(f => f.toLowerCase().includes(q))) return;
    if (!p.coords) return;
    bounds.push(p.coords);
    L.circleMarker(p.coords, { radius: 7, fillColor: '#ff6a1a', color: '#ffffff', weight: 1.5, opacity: 1, fillOpacity: 0.9 })
      .addTo(map)
      .bindPopup(`<strong>${p.area}</strong><br>${p.access}<br><button class="link" data-pit="${p.id}">View pit →</button>`);
  });
  if (bounds.length > 0) map.fitBounds(bounds, { padding: [40, 40], maxZoom: 15 });
  setTimeout(() => map && map.invalidateSize(), 150);
}

});

document.addEventListener('click', async e => {
  const oauth = e.target.closest('[data-auth]');
  if (oauth) await sb.auth.signInWithOAuth({ provider: oauth.dataset.auth });
  const modeBtn = e.target.closest('[data-auth-mode]');
  if (modeBtn) { authUi.mode = modeBtn.dataset.authMode; rerenderLogin(); }
  const eye = e.target.closest('[data-toggle-pw]');
  if (eye) {
    const input = document.getElementById('login-password');
    const show = input.type === 'password';
    input.type = show ? 'text' : 'password';
    eye.setAttribute('aria-pressed', String(show));
  }
  if (e.target.closest('[data-signout]')) await sb.auth.signOut();
});

const view = $('#view'), nav = $('#nav');
const history = [];

function go(route, { push = true } = {}) {
  if (!screens[route] || (!session && route !== 'login')) route = 'login';
  if (push) history.push(route);
  if (route !== 'explore' && route !== 'map') destroyMap();
  view.innerHTML = screens[route]();
  view.className = route === 'login' ? 'auth' : '';
  view.scrollTop = 0;
  nav.hidden = route === 'login';
  nav.querySelectorAll('[data-tab]').forEach(b => {
    if (b.dataset.tab === TAB[route]) b.setAttribute('aria-current', 'page');
    else b.removeAttribute('aria-current');
  });
  view.dataset.route = route;
  view.focus({ preventScroll: true });
  if (route === 'map' || (route === 'explore' && state.listMode === 'map')) requestAnimationFrame(initMap);
  if (route === 'pit') { loadPitWeather(); loadPitCarparks(); }
}

window.viewPitFromMap = (pitId) => {
  state.viewing = pitId;
  state.recent = [pitId, ...state.recent.filter(id => id !== pitId)].slice(0, 5);
  go('pit');
};

function back() {
  history.pop();
  go(history[history.length - 1] || 'explore', { push: false });
}

document.addEventListener('click', e => {
  const modeBtn = e.target.closest('[data-mode]');
  if (modeBtn) {
    state.listMode = modeBtn.dataset.mode;
    const listContainer = document.getElementById('pit-list-container');
    const mapContainer = document.getElementById('onemap');
    if (listContainer && mapContainer) {
      listContainer.style.display = state.listMode === 'list' ? 'flex' : 'none';
      mapContainer.style.display = state.listMode === 'map' ? 'block' : 'none';
      document.querySelectorAll('[data-mode]').forEach(b => b.setAttribute('aria-pressed', b.dataset.mode === state.listMode));
      if (state.listMode === 'map') setTimeout(initMap, 50);
    } else {
      go('explore', { push: false });
    }
    return;
  }

  const t = e.target.closest('[data-go],[data-save],[data-pit],[data-compare],[data-back]');
  if (!t) return;
  
  if (t.dataset.save) {
    state.saved.has(t.dataset.save) ? state.saved.delete(t.dataset.save) : state.saved.add(t.dataset.save);
    const top = view.scrollTop; go(view.dataset.route, { push: false }); view.scrollTop = top;
  } else if (t.dataset.pit) {
    state.viewing = t.dataset.pit;
    state.recent = [t.dataset.pit, ...state.recent.filter(id => id !== t.dataset.pit)].slice(0, 5);
    go('pit');
  } else if (t.dataset.compare) {
    state.comparing = [state.baseline, t.dataset.compare]; go('compare');
  } else if ('back' in t.dataset) {
    back();
  } else {
    if (t.dataset.go === 'search') state.baseline = state.viewing;
    go(t.dataset.go);
  }
});

if (!sb) {
  go('login');
  authMsg('Sign-in could not load.', true);
} else {
  loadSupabasePits();
  sb
    .channel('public:pits')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'pits_table' }, payload => {
      console.log('Realtime DB change received:', payload);
      loadSupabasePits();
    })
    .subscribe();

  sb.auth.onAuthStateChange((event, s) => {
    session = s;
    const route = view.dataset.route;
    if (event === 'INITIAL_SESSION') go(s ? 'explore' : 'login', { push: false });
    else if (event === 'SIGNED_IN' && route === 'login') go('explore');
    else if (event === 'SIGNED_OUT') { history.length = 0; Object.assign(authUi, { step: 'email', mode: 'login', email: '' }); go('login'); }
  });
}
</script>
