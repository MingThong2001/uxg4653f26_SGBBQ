<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lepakaki | BBQ Pit Map</title>

  <!-- Leaflet map styles -->
  <link
    rel="stylesheet"
    href="https://www.onemap.gov.sg/web-assets/libs/leaflet/leaflet.css"
  />

  <link rel="stylesheet" href="style.css">
  <style>
    /* Reset body and html for mobile container testing */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f8f9fa;
      color: #333;
    }

    /* Emulate mobile device container if desired */
    .mobile-container {
      width: 100%;
      max-width: 402px;
      height: 100vh;
      max-height: 874px;
      margin: 0 auto;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 20px rgba(0,0,0,0.1);
      overflow: hidden;
    }

    header.app-header {
      padding: 16px;
      background: #fff;
      border-bottom: 1px solid #eee;
    }

    header.app-header h1 {
      margin: 0;
      font-size: 1.25rem;
      color: #d9534f;
    }

    header.app-header p {
      margin: 4px 0 0;
      font-size: 0.85rem;
      color: #666;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 16px;
      overflow-y: auto;
    }

    main h2 {
      font-size: 1rem;
      margin-top: 0;
      margin-bottom: 12px;
    }

    /* Force the map container to take up remaining vertical space */
    #map {
      width: 100%;
      flex: 1;
      min-height: 350px;
      border-radius: 12px;
    }
  </style>
</head>
<body>
  <div class="mobile-container">
    <header class="app-header">
      <h1>Lepakaki</h1>
      <p>Find your next BBQ spot in Singapore.</p>
    </header>

    <main>
      <h2>Explore BBQ Pits</h2>
      <div id="map"></div>
    </main>
  </div>

  <!-- OneMap's Leaflet library -->
  <script src="https://www.onemap.gov.sg/web-assets/libs/leaflet/onemap-leaflet.js"></script>

  <script>
    // Centre the map on Singapore
    const map = L.map("map", {
      center: [1.2868, 103.8545],
      zoom: 12,
      minZoom: 11,
      maxZoom: 19
    });

    // Add the OneMap base layer
    L.tileLayer(
      "https://www.onemap.gov.sg/maps/tiles/Default/{z}/{x}/{y}.png",
      {
        detectRetina: true,
        minZoom: 11,
        maxZoom: 19,
        attribution:
          '<a href="https://www.onemap.gov.sg/" target="_blank">OneMap</a> | ' +
          '<a href="https://www.sla.gov.sg/" target="_blank">SLA</a>'
      }
    ).addTo(map);

    // Fix grey tile issue when container resizes or initializes
    setTimeout(() => {
      map.invalidateSize();
    }, 100);
  </script>
</body>
</html>
